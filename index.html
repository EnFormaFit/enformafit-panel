<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnFormaFit Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --az:#1A2B5A;--az2:#2E6DA4;--az3:#EEF3FA;--az4:#D6E8F5;
  --vd:#0DBF6F;--vd2:#D4F7E8;--vd3:#7BE8B4;
  --nr:#FF6B00;--nr2:#FFF0E5;
  --rj:#E74C3C;--rj2:#FFE5E5;
  --am:#F39C12;--am2:#FEF3E2;
  --bg:#F0F2F7;--bor:#E2E6EF;--bor2:#F0F2F8;
  --t1:#1A2B5A;--t2:#5A6480;--t3:#9199AD;
  --sb:220px;--top:52px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;overflow:hidden}

/* LAYOUT */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sb);background:var(--az);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--bor);height:var(--top);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}

/* SIDEBAR */
.sb-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sb-logo img{height:22px;width:auto;filter:brightness(0) invert(1);display:block}
.sb-section{padding:14px 14px 5px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 12px;color:rgba(255,255,255,.7);cursor:pointer;border-radius:7px;margin:1px 8px;font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;width:calc(100% - 16px);text-align:left;font-family:inherit}
.sb-item:hover{background:rgba(255,255,255,.09);color:#fff}
.sb-item.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.sb-item svg{width:15px;height:15px;flex-shrink:0;opacity:.75}
.sb-item.on svg{opacity:1}
.sb-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-badge.rj{background:var(--rj);color:#fff}
.sb-badge.am{background:var(--am);color:#fff}
.sb-badge.vd{background:var(--vd);color:#fff}
.sb-badge.az{background:rgba(255,255,255,.2);color:#fff}
.sb-divider{border:none;border-top:1px solid rgba(255,255,255,.1);margin:6px 0}
.sb-bottom{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.sb-trainer{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.8);font-size:12px}
.sb-av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}

/* TOPBAR */
.tb-title{font-size:15px;font-weight:700;flex:1}
.tb-search{border:1.5px solid var(--bor);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;font-family:inherit;width:240px;transition:border .15s}
.tb-search:focus{border-color:var(--az2)}
.tb-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--bor);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t2);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.tb-btn:hover{border-color:var(--az2);color:var(--az2)}
.tb-btn.primary{background:var(--vd);border-color:var(--vd);color:#fff}

/* CARDS */
.card{background:#fff;border-radius:12px;border:1px solid var(--bor);overflow:hidden}
.ch{padding:13px 16px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.ch h2{font-size:14px;font-weight:700}
.cb{padding:14px 16px}

/* KPIs */
.kpig{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1200px){.kpig{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:12px;border:1px solid var(--bor);padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.kpi-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.kpi-v{font-size:24px;font-weight:800;line-height:1;margin-bottom:2px}
.kpi-l{font-size:11px;color:var(--t3);font-weight:500}
.kpi-d{font-size:11px;font-weight:600;margin-top:3px}

/* TABS */
.tabs-bar{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tab-btn{padding:6px 14px;border-radius:6px;border:none;background:none;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.tab-btn.on{background:#fff;color:var(--az);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bvd{background:var(--vd2);color:#07854D}.baz{background:var(--az3);color:var(--az2)}
.bnr{background:var(--nr2);color:#CC5500}.brj{background:var(--rj2);color:var(--rj)}
.bam{background:var(--am2);color:#B7770D}.bgr{background:var(--bg);color:var(--t3)}

/* SEMÁFORO */
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dvd{background:var(--vd)}.dam{background:var(--am)}.drj{background:var(--rj)}

/* ALERT ROW */
.alert-row{padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;border-bottom:1px solid var(--bor2)}
.alert-row:last-child{border-bottom:none}
.alert-row.rj{background:var(--rj2);border-left:3px solid var(--rj)}
.alert-row.am{background:var(--am2);border-left:3px solid var(--am)}

/* CLIENTE TABLE */
.ctable{width:100%;border-collapse:collapse}
.ctable th{padding:8px 14px;font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;text-align:left;background:var(--bg);border-bottom:2px solid var(--bor)}
.ctable td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--bor2)}
.ctable tr:last-child td{border-bottom:none}
.ctable tr:hover td{background:#FAFBFF;cursor:pointer}
.cr-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}

/* DRAWER */
.drawer{position:fixed;top:0;right:0;width:520px;height:100vh;background:#fff;border-left:1px solid var(--bor);z-index:100;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.doverlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none;backdrop-filter:blur(2px)}
.doverlay.show{display:block}
.dh{padding:14px 18px;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:11px;flex-shrink:0;background:#fff}
.dh-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.dtabs{display:flex;border-bottom:1px solid var(--bor);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--t3);border:none;background:none;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0;transition:all .15s}
.dtab.on{color:var(--az);border-bottom-color:var(--az);font-weight:700}
.dbody{padding:16px 18px;overflow-y:auto;flex:1}

/* DATO ROW */
.dato{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bor2);font-size:13px}
.dato:last-child{border-bottom:none}
.dato label{color:var(--t2);font-weight:500}
.dato .val{font-weight:700}
.dato-inp{border:1.5px solid var(--az2);border-radius:6px;padding:5px 8px;font-size:13px;font-weight:600;outline:none;font-family:inherit;width:110px;text-align:right}

/* CHECK-IN VISUAL */
.ci-box{background:var(--bg);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--bor)}
.ci-v{font-size:20px;font-weight:800;margin-bottom:2px}
.ci-l{font-size:10px;color:var(--t3);font-weight:500}
.dd{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.dd-on{background:var(--vd);color:#fff}.dd-off{background:var(--bg);color:var(--t3);border:1px solid var(--bor)}

/* REVISION FOTOS */
.rev-fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.rev-foto{aspect-ratio:3/5;border-radius:7px;background:var(--bg);border:1px solid var(--bor);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);text-align:center;padding:4px}
.rev-foto img{width:100%;height:100%;object-fit:cover}
.rev-med2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.rev-med-box{background:var(--bg);border-radius:7px;padding:9px 11px;border:1px solid var(--bor)}
.rev-med-l{font-size:10px;color:var(--t3);margin-bottom:2px}
.rev-med-v{font-size:16px;font-weight:800;color:var(--az)}

/* MINI CHART */
svg.mc{overflow:visible}

/* FB */
.fb{border:1.5px solid var(--az2);border-radius:8px;padding:10px}
.fb textarea{width:100%;border:none;outline:none;font-family:inherit;font-size:13px;resize:none;min-height:80px;color:var(--t1)}

/* ══ EDITOR RUTINAS ══ */
.rut-header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rut-cli-sel{border:1.5px solid var(--bor);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;font-family:inherit;flex:1;min-width:200px;background:#fff}
.rut-sem-strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rut-sem-strip::-webkit-scrollbar{display:none}
.rut-sem-btn{flex-shrink:0;padding:5px 10px;border-radius:6px;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.rut-sem-btn.on{background:var(--az);border-color:var(--az);color:#fff}
.rut-sem-btn.rev{border-color:var(--az2);color:var(--az2)}
.rut-sem-btn.on.rev{background:var(--az2);border-color:var(--az2);color:#fff}
.rut-day-strip{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rut-day-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.rut-day-btn.on{background:var(--az);border-color:var(--az);color:#fff}
.rut-day-btn.rest{color:var(--t3);font-style:italic}
.ej-grid-hd{display:grid;grid-template-columns:20px 1fr 56px 70px 44px 70px 28px;gap:5px;padding:6px 10px;background:var(--bg);border-radius:7px 7px 0 0;border:1px solid var(--bor);border-bottom:none}
.ej-grid-hd span{font-size:9.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}
.ej-row{display:grid;grid-template-columns:20px 1fr 56px 70px 44px 70px 28px;gap:5px;padding:6px 10px;border:1px solid var(--bor);border-top:none;background:#fff;align-items:center;transition:background .1s}
.ej-row:hover{background:#FAFBFF}
.ej-row:last-child{border-radius:0 0 7px 7px}
.ej-num{font-size:11px;font-weight:700;color:var(--t3);text-align:center}
.ej-inp{border:1.5px solid transparent;border-radius:6px;padding:5px 7px;font-size:13px;font-weight:600;outline:none;font-family:inherit;width:100%;background:transparent;transition:all .15s}
.ej-inp:hover,.ej-inp:focus{border-color:var(--az2);background:#fff}
.ej-inp.rir{color:var(--nr)}
.ej-sel{border:1.5px solid transparent;border-radius:6px;padding:5px 4px;font-size:12px;outline:none;font-family:inherit;width:100%;background:transparent;cursor:pointer;transition:all .15s}
.ej-sel:hover,.ej-sel:focus{border-color:var(--az2);background:#fff}
.ej-del{background:none;border:none;cursor:pointer;color:var(--t3);font-size:16px;padding:2px;border-radius:4px;transition:all .15s;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.ej-del:hover{background:var(--rj2);color:var(--rj)}

/* AUTOCOMPLETE */
.ac-wrap{position:relative;width:100%}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--az2);border-top:none;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--bor2);display:flex;justify-content:space-between;align-items:center}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--az3)}
.ac-item small{font-size:11px;color:var(--t3)}

/* COPY/PASTE TOOLBAR */
.cp-bar{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--az3);border-radius:8px;margin-bottom:10px;font-size:12px;color:var(--az2);font-weight:600;flex-wrap:wrap}
.cp-btn{padding:5px 12px;border-radius:6px;border:1.5px solid var(--az2);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--az2);transition:all .15s}
.cp-btn:hover{background:var(--az2);color:#fff}
.cp-btn.active{background:var(--vd);border-color:var(--vd);color:#fff}

/* UTILS */
.pb{height:5px;background:var(--bor);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.btn{padding:8px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:all .15s}
.btnp{background:var(--vd);color:#fff}.btno{background:#fff;color:var(--az2);border:1.5px solid var(--bor)}.btnrj{background:var(--rj);color:#fff}
.btnf{width:100%;justify-content:center;padding:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--az);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.vd{background:var(--vd)}.toast.rj{background:var(--rj)}
input[type=file]{display:none}
svg.mini{overflow:visible}
</style>
</head>

// ── STATE ──
let SEC='ci', CUR=null, DTAB='resumen', EDITING=false, SEARCH='';
let RUT_CLI=null, RUT_SEM=1, RUT_DIA=0;
// Copy/paste state for rutinas
let CP_MODE=null; // null | 'semana' | 'dia' | 'ej'
let CP_DATA=null; // copied data
let CP_EJ_IDX=null; // copied exercise index
// Rutina data: {cliId: {sem: {dia: [ejercicios]}}}
const RUTINAS={};

const COLORES=['#1A2B5A','#2E6DA4','#0DBF6F','#FF6B00','#9B59B6','#E74C3C','#27AE60','#E67E22','#2980B9'];
const DL=['L','M','X','J','V','S','D'];
function gc(i){return COLORES[i%COLORES.length];}
function adhCol(a){return a>=.8?'var(--vd)':a>=.6?'var(--am)':'var(--rj)';}
function adhDot(a){return a>=.8?'dvd':a>=.6?'dam':'drj';}
function adhCls(a){return a>=.8?'bvd':a>=.6?'bam':'brj';}
function revSems(tipo){return tipo==='programa'?[4,8,12]:[3,7,11];}
function semTotal(tipo){return tipo==='programa'?14:13;}

// ── INIT ──
window.addEventListener('DOMContentLoaded',()=>{updateBadges();S('ci');});

function updateBadges(){
  const uno=CLIENTES.filter(c=>c.tipo==='uno');
  const prog=CLIENTES.filter(c=>c.tipo==='programa');
  const ciPend=uno.filter(c=>!c.checkInDone).length;
  const rev1=uno.filter(c=>c.semana===c.nextRev).length;
  const revP=prog.filter(c=>c.semana===c.nextRev).length;
  const alerts=CLIENTES.filter(c=>c.diasSinPeso>7).length;
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('sbb-ci',ciPend);set('sbb-rev1',rev1);set('sbb-revp',revP);
  set('sbb-uno',uno.length);set('sbb-prog',prog.length);set('sbb-alert',alerts);
}

// ── NAV ──
const TITLES={
  ci:'Check-ins semana',rev1:'Revisiones 1:1',uno:'Clientes 1:1',
  revp:'Revisiones programa',prog:'Clientes programa',
  rut:'Editor de rutinas',alert:'Alertas',log:'Lógicas del plan',nuevo:'Nuevo cliente'
};
function S(s){
  SEC=s;SEARCH='';
  document.getElementById('tb-t').textContent=TITLES[s]||s;
  document.getElementById('tb-s').value='';
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('on'));
  const el=document.getElementById('sbi-'+s);if(el)el.classList.add('on');
  const fns={
    ci:renderCI,rev1:()=>renderRevsec('uno'),uno:()=>renderClientes('uno'),
    revp:()=>renderRevsec('prog'),prog:()=>renderClientes('prog'),
    rut:renderRutinas,alert:renderAlertas,log:renderLogicas,nuevo:renderNuevo
  };
  const ct=document.getElementById('ct');
  ct.innerHTML='';
  const html=(fns[s]||renderCI)();
  ct.innerHTML=html;
}
function search(q){SEARCH=q.toLowerCase();if(SEC==='uno'||SEC==='prog')S(SEC);}
function toast(msg,t=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(t?' '+t:'');setTimeout(()=>el.classList.remove('show'),2600);}

// ── DRAWER ──
function openD(id,tab='resumen'){
  CUR=CLIENTES.find(c=>c.id===id);if(!CUR)return;
  DTAB=tab;EDITING=false;
  const ci=CLIENTES.indexOf(CUR);
  document.getElementById('d-av').textContent=CUR.init;
  document.getElementById('d-av').style.background=gc(ci);
  document.getElementById('d-nom').textContent=CUR.nom;
  document.getElementById('d-sub').textContent=(CUR.tipo==='uno'?'1:1':'Programa')+' · S'+CUR.semana+'/'+CUR.semTotal;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('dov').classList.add('show');
  renderD();
}
function closeD(){document.getElementById('drawer').classList.remove('open');document.getElementById('dov').classList.remove('show');CUR=null;}
function setDtab(t){DTAB=t;EDITING=false;renderD();}
function renderD(){
  if(!CUR)return;
  const tabs=CUR.tipo==='uno'
    ?['resumen','checkin','revision','plan','editar']
    :['resumen','revision','plan','editar'];
  const noms={resumen:'Resumen',checkin:'Check-in',revision:'Revisión',plan:'Plan',editar:'Editar'};
  document.getElementById('d-tabs').innerHTML=tabs.map(t=>`<button class="dtab ${t===DTAB?'on':''}" onclick="setDtab('${t}')">${noms[t]}</button>`).join('');
  const fns={resumen:dResumen,checkin:dCheckin,revision:dRevision,plan:dPlan,editar:dEditar};
  document.getElementById('d-body').innerHTML=(fns[DTAB]||dResumen)();
}

// ── CHECK-INS (solo 1:1) ──
function renderCI(){
  const uno=CLIENTES.filter(c=>c.tipo==='uno');
  const env=uno.filter(c=>c.checkInDone);
  const pend=uno.filter(c=>!c.checkInDone);
  const adhMedia=uno.length?Math.round(uno.reduce((s,c)=>s+c.adh,0)/uno.length*100):0;
  const biest=env.length?((env.reduce((s,c)=>s+(c.checkIn?.estrellas||0),0)/env.length).toFixed(1)):'—';

  let h=`<div class="kpig">
    <div class="kpi"><div class="kpi-ico" style="background:var(--vd2)">✅</div><div><div class="kpi-v" style="color:var(--vd)">${env.length}</div><div class="kpi-l">Enviados</div><div class="kpi-d" style="color:var(--vd)">de ${uno.length} clientes 1:1</div></div></div>
    <div class="kpi"><div class="kpi-ico" style="background:var(--am2)">⏳</div><div><div class="kpi-v" style="color:var(--am)">${pend.length}</div><div class="kpi-l">Pendientes</div></div></div>
    <div class="kpi"><div class="kpi-ico" style="background:var(--az3)">⭐</div><div><div class="kpi-v" style="color:var(--az2)">${biest}</div><div class="kpi-l">Media bienestar</div><div class="kpi-d" style="color:var(--t3)">sobre 5</div></div></div>
    <div class="kpi"><div class="kpi-ico" style="background:var(--vd2)">📊</div><div><div class="kpi-v" style="color:var(--az)">${adhMedia}%</div><div class="kpi-l">Adherencia media</div></div></div>
  </div>`;

  if(pend.length){
    h+=`<div class="card"><div class="ch"><h2>⏳ Pendientes (${pend.length})</h2></div>`;
    pend.forEach(c=>{h+=`<div class="alert-row am" style="cursor:pointer" onclick="openD('${c.id}','checkin')"><div class="dot ${adhDot(c.adh)}"></div><div style="flex:1"><b>${c.nom}</b> <span style="color:var(--t3);font-size:12px">· S${c.semana}/${c.semTotal}</span></div><span style="font-size:12px;color:var(--az2);font-weight:600">Ver →</span></div>`;});
    h+=`</div>`;
  }

  h+=`<div class="card"><div class="ch"><h2>✅ Recibidos (${env.length})</h2></div><table class="ctable"><thead><tr><th>Cliente</th><th>Adh.</th><th>Entrenos</th><th>Nutrición</th><th>Pasos</th><th>⭐</th><th></th></tr></thead><tbody>`;
  env.forEach((c,i)=>{
    const ci=c.checkIn||{};
    h+=`<tr onclick="openD('${c.id}','checkin')">
      <td><div style="display:flex;align-items:center;gap:8px"><div class="cr-av" style="background:${gc(CLIENTES.indexOf(c))}">${c.init}</div>${c.nom}</div></td>
      <td><span class="badge ${adhCls(c.adh)}">${Math.round(c.adh*100)}%</span></td>
      <td>${ci.entrenos||0}</td>
      <td>${ci.nutriDias?.length||0}/7</td>
      <td>${ci.pasosDias?.length||0}/7</td>
      <td>${'⭐'.repeat(ci.estrellas||0)}</td>
      <td style="color:var(--az2);font-weight:600;font-size:12px">Ver →</td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

// ── REVISIONES (por tipo) ──
function renderRevsec(tipo){
  const filtro=tipo==='uno'?'uno':'programa';
  const clis=CLIENTES.filter(c=>c.tipo===filtro);
  const conRev=clis.filter(c=>c.semana===c.nextRev);
  const env=conRev.filter(c=>c.revDone);
  const pend=conRev.filter(c=>!c.revDone);
  const prox=clis.filter(c=>c.nextRev-c.semana===1);
  const label=filtro==='uno'?'1:1':'Programa grupal';

  let h=`<div class="kpig">
    <div class="kpi"><div class="kpi-ico" style="background:var(--rj2)">📋</div><div><div class="kpi-v" style="color:var(--rj)">${conRev.length}</div><div class="kpi-l">Revisiones esta semana</div><div class="kpi-d" style="color:var(--t3)">${label}</div></div></div>
    <div class="kpi"><div class="kpi-ico" style="background:var(--vd2)">✅</div><div><div class="kpi-v" style="color:var(--vd)">${env.length}</div><div class="kpi-l">Recibidas</div></div></div>
    <div class="kpi"><div class="kpi-ico" style="background:var(--am2)">⏳</div><div><div class="kpi-v" style="color:var(--am)">${pend.length}</div><div class="kpi-l">Pendientes</div></div></div>
    <div class="kpi"><div class="kpi-ico" style="background:var(--az3)">📅</div><div><div class="kpi-v" style="color:var(--az2)">${prox.length}</div><div class="kpi-l">Próx. semana</div></div></div>
  </div>`;

  if(env.length){
    h+=`<div class="card"><div class="ch"><h2>✅ Recibidas — dar feedback</h2></div>`;
    env.forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bor2);cursor:pointer" onclick="openD('${c.id}','revision')"><div class="cr-av" style="background:${gc(CLIENTES.indexOf(c))}">${c.init}</div><div style="flex:1"><div style="font-weight:700">${c.nom}</div><div style="font-size:12px;color:var(--t3)">S${c.nextRev}/${c.semTotal} · ${c.revision?.fecha||''}</div></div><span class="badge bvd">Enviada</span><span style="font-size:12px;color:var(--az2);font-weight:700;margin-left:8px">Feedback →</span></div>`;});
    h+=`</div>`;
  }
  if(pend.length){
    h+=`<div class="card"><div class="ch"><h2>⏳ Pendientes de enviar</h2></div>`;
    pend.forEach(c=>{h+=`<div class="alert-row am" style="cursor:pointer" onclick="openD('${c.id}','resumen')"><div class="dot dam"></div><div style="flex:1"><b>${c.nom}</b> <span style="color:var(--t3);font-size:12px">S${c.nextRev} esta semana</span></div><span style="font-size:12px;color:var(--az2)">Ver →</span></div>`;});
    h+=`</div>`;
  }
  if(prox.length){
    h+=`<div class="card"><div class="ch"><h2>📅 La semana que viene</h2></div><div class="cb" style="display:flex;flex-wrap:wrap;gap:8px">`;
    prox.forEach(c=>{h+=`<div class="badge baz" style="cursor:pointer" onclick="openD('${c.id}','resumen')">${c.nom} · S${c.nextRev}</div>`;});
    h+=`</div></div>`;
  }
  return h;
}

// ── CLIENTES TABLE ──
function renderClientes(tipo){
  const filtro=tipo==='uno'?'uno':'programa';
  const label=filtro==='uno'?'👤 Clientes 1:1':'👥 Clientes programa';
  let clis=CLIENTES.filter(c=>c.tipo===filtro);
  if(SEARCH)clis=clis.filter(c=>c.nom.toLowerCase().includes(SEARCH));
  if(!clis.length)return`<div class="card"><div class="cb" style="text-align:center;color:var(--t3);padding:30px">No hay clientes${SEARCH?' que coincidan':''}</div></div>`;

  let h=`<div class="card"><div class="ch"><h2>${label} (${clis.length})</h2></div>
  <table class="ctable"><thead><tr><th>Cliente</th><th>Semana</th><th>Adherencia</th><th>Peso</th><th>Objetivo</th><th>Próx. rev.</th>${filtro==='uno'?'<th>Check-in</th>':''}<th></th></tr></thead><tbody>`;
  clis.forEach(c=>{
    const ri=c.nextRev-c.semana;
    h+=`<tr onclick="openD('${c.id}','resumen')">

function dResumen(){
  const c=CUR;
  const ci=CLIENTES.indexOf(c);
  const cambio=(c.pesoAct-c.pesoIni).toFixed(1);
  const left=(c.pesoAct-c.obj).toFixed(1);
  // Mini chart
  let chart='<div style="font-size:12px;color:var(--t3);text-align:center;padding:10px">Sin datos de peso</div>';
  if(c.histPesos&&c.histPesos.length>1){
    const vals=c.histPesos.map(p=>p.v);
    const W=440,H=65,PL=28,PR=8,PT=8,PB=18;
    const mn=Math.min(...vals,c.obj)-1,mx=Math.max(...vals)+1;
    const xOf=i=>PL+(i/(vals.length-1))*(W-PL-PR);
    const yOf=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
    const pts=vals.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    const oy=yOf(c.obj);
    const area=`${xOf(0).toFixed(1)},${(H-PB).toFixed(1)} `+vals.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ')+` ${xOf(vals.length-1).toFixed(1)},${(H-PB).toFixed(1)}`;
    chart=`<svg class="mini" viewBox="0 0 ${W} ${H}" style="width:100%;height:65px">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6DA4" stop-opacity=".15"/><stop offset="100%" stop-color="#2E6DA4" stop-opacity="0"/></linearGradient></defs>
      <line x1="${PL}" y1="${oy.toFixed(1)}" x2="${W-PR}" y2="${oy.toFixed(1)}" stroke="#0DBF6F" stroke-width="1.5" stroke-dasharray="5,3"/>
      <polygon points="${area}" fill="url(#cg)"/>
      <polyline points="${pts}" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xOf(vals.length-1).toFixed(1)}" cy="${yOf(vals[vals.length-1]).toFixed(1)}" r="4.5" fill="#2E6DA4" stroke="#fff" stroke-width="2"/>
      <text x="${W-PR}" y="${(oy-5).toFixed(1)}" text-anchor="end" font-size="9" fill="#0DBF6F" font-weight="600">obj ${c.obj}</text>
    </svg>`;
  }
  return`
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
    <div class="ci-box"><div class="ci-v" style="color:${adhCol(c.adh)}">${Math.round(c.adh*100)}%</div><div class="ci-l">Adherencia</div></div>
    <div class="ci-box"><div class="ci-v" style="color:var(--az2)">${c.pesoAct}kg</div><div class="ci-l">Peso actual</div></div>
    <div class="ci-box"><div class="ci-v" style="color:${parseFloat(cambio)<0?'var(--vd)':'var(--rj)'}">${cambio>0?'+':''}${cambio}kg</div><div class="ci-l">Cambio</div></div>
  </div>
  <div style="margin-bottom:12px">${chart}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
    <div class="ci-box"><div class="ci-v" style="color:var(--az);font-size:16px">${c.obj}kg</div><div class="ci-l">Objetivo</div></div>
    <div class="ci-box"><div class="ci-v" style="color:${parseFloat(left)>0?'var(--nr)':'var(--vd)'};font-size:16px">${parseFloat(left)>0?left+'kg':'✅'}</div><div class="ci-l">Para objetivo</div></div>
  </div>
  ${c.lesiones?`<div style="background:var(--am2);border:1px solid var(--am);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px"><b>🩹</b> ${c.lesiones}</div>`:''}

function getRutina(cliId,sem,dia){
  if(!RUTINAS[cliId])RUTINAS[cliId]={};
  if(!RUTINAS[cliId][sem])RUTINAS[cliId][sem]={};
  if(!RUTINAS[cliId][sem][dia]){
    // Initialize from defaults
    const def=EJ_DEFAULT[dia]||[];
    RUTINAS[cliId][sem][dia]=JSON.parse(JSON.stringify(def));
  }
  return RUTINAS[cliId][sem][dia];
}

  const cli=RUT_CLI?CLIENTES.find(c=>c.id===RUT_CLI):null;

        <h2>${diaActual.nom} · ${diaActual.tipo} · S${RUT_SEM}</h2>

      <div style="overflow-x:auto">
        <div class="ej-grid-hd">
          <span>#</span><span>Ejercicio</span><span style="text-align:center">Series</span>
          <span style="text-align:center">Reps</span><span style="text-align:center;color:var(--nr)">RIR</span>
          <span style="text-align:center">Descanso</span><span></span>
        </div>
        <div id="ej-list">
          ${ejes.map((ej,ei)=>renderEjRow(ej,ei,RUT_CLI,RUT_SEM,RUT_DIA)).join('')}
        </div>
      </div>
    </div>`;
  }

  return`
  <div class="rut-header">
    <select class="rut-cli-sel" onchange="RUT_CLI=this.value;RUT_SEM=1;RUT_DIA=0;S('rut')">
      <option value="">-- Selecciona cliente --</option>
      ${cliOpts}
    </select>
    <button class="btn btnp" onclick="guardarRutina()">💾 Guardar</button>
    <button class="btn btno" onclick="openD('${RUT_CLI}','resumen')">Ver ficha</button>
  </div>

  <div class="card">
    <div class="ch"><h2>Semanas del bloque <span style="font-size:12px;color:var(--t3);font-weight:400">${revSems(cli.tipo).map(s=>'S'+s).join(', ')} = revisión · S${cli.semana} = actual</span></h2></div>
    <div class="cb" style="padding:10px 14px"><div class="rut-sem-strip">${semStrip}</div></div>
  </div>

  <div class="card">
    <div class="ch"><h2>Días</h2></div>
    <div class="cb" style="padding:10px 14px"><div class="rut-day-strip">${dayBtns}</div></div>
  </div>

  ${cpBar}
  ${ejSection}
  `;
}

function renderEjRow(ej,ei,cliId,sem,dia){
  const hasUrl=ej.url&&ej.url.trim();
  return`<div class="ej-row" id="ejr-${ei}">
    <span class="ej-num">${ei+1}</span>
    <div class="ac-wrap">
      <input class="ej-inp" value="${ej.nom}" placeholder="Nombre ejercicio..."
        oninput="acSearch(this,${ei})" onfocus="acSearch(this,${ei})" onblur="setTimeout(()=>acHide(${ei}),200)"
        onchange="updateEj(${ei},'nom',this.value)">
      <div class="ac-list" id="ac-${ei}" style="display:none"></div>
    </div>
    <input class="ej-inp" type="number" value="${ej.sets}" placeholder="4" style="text-align:center" onchange="updateEj(${ei},'sets',parseInt(this.value)||3)">
    <input class="ej-inp" value="${ej.reps}" placeholder="8-10" style="text-align:center" onchange="updateEj(${ei},'reps',this.value)">
    <input class="ej-inp rir" type="number" min="0" max="5" value="${ej.rir}" placeholder="2" style="text-align:center" onchange="updateEj(${ei},'rir',parseInt(this.value)||0)">
    <select class="ej-sel" onchange="updateEj(${ei},'rest',parseInt(this.value))">
      ${[60,90,120,150,180].map(s=>`<option value="${s}" ${ej.rest===s?'selected':''}>${s<60?s+'s':s===60?'1min':s===90?'1:30':s===120?'2min':s===150?'2:30':'3min'}</option>`).join('')}
    </select>
    <div style="display:flex;gap:3px">
      ${hasUrl?`<a href="${ej.url}" target="_blank" title="Ver vídeo" style="background:var(--rj2);border:none;border-radius:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--rj);font-size:11px;text-decoration:none">▶</a>`:''}
      <button class="ej-del" onclick="delEj(${ei})" title="Eliminar">✕</button>
    </div>
  </div>`;
}

// ── AUTOCOMPLETE ──
function acSearch(inp,ei){
  const q=inp.value.toLowerCase().trim();
  const list=document.getElementById('ac-'+ei);
  if(!list)return;
  if(!q||q.length<2){list.style.display='none';return;}
  const matches=EJS.filter(e=>e.nombre.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){list.style.display='none';return;}
  list.innerHTML=matches.map(e=>`<div class="ac-item" onmousedown="acSelect(${ei},'${e.nombre.replace(/'/g,"\\'")}')">
    ${e.nombre}<small>${e.grupo||''}</small>
  </div>`).join('');
  list.style.display='block';
}
function acHide(ei){const l=document.getElementById('ac-'+ei);if(l)l.style.display='none';}
function acSelect(ei,nom){
  // Find exercise data and fill fields
  const ej=EJS.find(e=>e.nombre===nom);
  if(!ej)return;
  const ejes=getRutina(RUT_CLI,RUT_SEM,RUT_DIA);
  if(ejes[ei]){
    ejes[ei].nom=ej.nombre;
    ejes[ei].sets=parseInt(ej.series)||3;
    ejes[ei].reps=ej.reps||'8-10';
    ejes[ei].rir=parseInt(ej.rir)||2;
    ejes[ei].url=ej.url||'';
    ejes[ei].acl=ej.acl||'';
    // Auto rest based on tipo
    const restMap={SQ:180,DL:180,BP:150};
    ejes[ei].rest=restMap[ej.tipo]||90;
  }
  acHide(ei);
  // Re-render the row
  const row=document.getElementById('ejr-'+ei);
  if(row)row.outerHTML=renderEjRow(ejes[ei],ei,RUT_CLI,RUT_SEM,RUT_DIA);
  toast(nom+' añadido ✓','vd');
}

function updateEj(ei,k,v){
  const ejes=getRutina(RUT_CLI,RUT_SEM,RUT_DIA);
  if(ejes[ei])ejes[ei][k]=v;
}
function addEj(){
  const ejes=getRutina(RUT_CLI,RUT_SEM,RUT_DIA);
  ejes.push({nom:'',sets:3,reps:'8-10',rir:2,rest:120,url:'',acl:''});
  S('rut');
  setTimeout(()=>{const inputs=document.querySelectorAll('.ej-inp');if(inputs.length)inputs[inputs.length-1].focus();},100);
}
function delEj(ei){
  const ejes=getRutina(RUT_CLI,RUT_SEM,RUT_DIA);
  ejes.splice(ei,1);
  S('rut');
}
function guardarRutina(){toast('Rutina S'+RUT_SEM+' guardada para '+CLIENTES.find(c=>c.id===RUT_CLI)?.nom,'vd');}
function cambiarAEntrenamiento(dia){toast('Función próximamente','');}

// ── COPY / PASTE ──
function copiarSemana(sem){
  const c=CLIENTES.find(c=>c.id===RUT_CLI);if(!c)return;
  // Copy all days of this sem
  const data={};
  DIAS_DEMO.forEach((_,di)=>{
    data[di]=JSON.parse(JSON.stringify(getRutina(RUT_CLI,sem,di)));
  });
  CP_MODE='semana';CP_DATA={sem,data};CP_EJ_IDX=null;
  toast('Semana S'+sem+' copiada — elige dónde pegar','vd');
  S('rut');
}
function copiarDia(sem,dia){
  const ejes=getRutina(RUT_CLI,sem,dia);
  CP_MODE='dia';CP_DATA={sem,dia,ejes:JSON.parse(JSON.stringify(ejes))};CP_EJ_IDX=null;
  const dnom=DIAS_DEMO[dia]?.nom||'Día';
  toast(dnom+' S'+sem+' copiado — elige dónde pegar','vd');
  S('rut');
}
function copiarEj(ei){
  const ejes=getRutina(RUT_CLI,RUT_SEM,RUT_DIA);
  if(!ejes[ei])return;
  CP_MODE='ej';CP_DATA={ej:JSON.parse(JSON.stringify(ejes[ei]))};CP_EJ_IDX=ei;
  toast(ejes[ei].nom+' copiado','vd');
  S('rut');
}
function pegarAqui(sem,dia){
  if(!CP_DATA){toast('Nada copiado','');return;}
  if(!RUTINAS[RUT_CLI])RUTINAS[RUT_CLI]={};
  if(!RUTINAS[RUT_CLI][sem])RUTINAS[RUT_CLI][sem]={};

  if(CP_MODE==='semana'){
    // Paste whole week into current sem
    Object.keys(CP_DATA.data).forEach(d=>{
      RUTINAS[RUT_CLI][sem][parseInt(d)]=JSON.parse(JSON.stringify(CP_DATA.data[d]));
    });
    toast('Semana S'+CP_DATA.sem+' pegada en S'+sem,'vd');
  } else if(CP_MODE==='dia'){
    RUTINAS[RUT_CLI][sem][dia]=JSON.parse(JSON.stringify(CP_DATA.ejes));
    toast(DIAS_DEMO[CP_DATA.dia]?.nom+' pegado en '+DIAS_DEMO[dia]?.nom+' S'+sem,'vd');
  } else if(CP_MODE==='ej'){
    const ejes=getRutina(RUT_CLI,sem,dia);
    ejes.push(JSON.parse(JSON.stringify(CP_DATA.ej)));
    toast(CP_DATA.ej.nom+' pegado ✓','vd');
  }
  CP_MODE=null;CP_DATA=null;
  S('rut');
}

// ── ALERTAS ──
function renderAlertas(){
  const sinPeso=CLIENTES.filter(c=>c.diasSinPeso>7).sort((a,b)=>b.diasSinPeso-a.diasSinPeso);
  const bajAdh=CLIENTES.filter(c=>c.adh<0.6);
  const lesiones=CLIENTES.filter(c=>c.lesiones&&c.lesiones.trim());
  const h=t=>t.length?t.map(c=>`<div class="alert-row ${t===sinPeso?'rj':'am'}" style="cursor:pointer" onclick="openD('${c.id}','resumen')">
    <div class="cr-av" style="background:${gc(CLIENTES.indexOf(c))};width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0">${c.init}</div>
    <div style="flex:1"><b>${c.nom}</b> <span style="color:var(--t3);font-size:12px">${t===sinPeso?'— '+c.diasSinPeso+' días sin peso':t===bajAdh?'— '+Math.round(c.adh*100)+'% adherencia':'— '+c.lesiones}</span></div>
    <span style="font-size:12px;color:var(--az2);font-weight:600">Ver →</span>
  </div>`).join(''):`<div style="padding:14px;color:var(--t3);font-size:13px">✅ Sin alertas</div>`;
  return`
  <div class="card"><div class="ch" style="background:var(--rj2)"><h2 style="color:var(--rj)">⚠️ Sin pesar +7 días</h2></div>${h(sinPeso)}</div>
  <div class="card"><div class="ch" style="background:var(--rj2)"><h2 style="color:var(--rj)">📉 Adherencia &lt;60%</h2></div>${h(bajAdh)}</div>
  <div class="card"><div class="ch" style="background:var(--am2)"><h2 style="color:var(--am)">🩹 Lesiones activas</h2></div>${h(lesiones)}</div>`;
}
