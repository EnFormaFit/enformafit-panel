<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnFormaFit Panel</title>
<style>
:root{
  --az:#1A2B5A;--az2:#2E6DA4;--az3:#EEF3FA;--az4:#D6E8F5;
  --vd:#0DBF6F;--vd2:#D4F7E8;--vd3:#7BE8B4;
  --nr:#FF6B00;--nr2:#FFF0E5;
  --rj:#E74C3C;--rj2:#FDEAEA;
  --am:#F39C12;--am2:#FEF3E2;
  --bg:#F0F2F7;--bor:#E2E6EF;--bor2:#F0F2F8;
  --t1:#1A2B5A;--t2:#5A6480;--t3:#9199AD;
  --sb:228px;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--t1);font-size:14px}

/* LAYOUT — position:fixed shell garantiza altura real en Mac */
.shell{position:fixed;inset:0;display:flex;overflow:hidden}
.sb{width:var(--sb);background:var(--az);flex-shrink:0;display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--bor);display:flex;
  align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.content{flex:1;overflow-y:scroll;overflow-x:hidden;padding:16px 18px;
  -webkit-overflow-scrolling:touch}

/* SIDEBAR */
.sb-logo{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sb-logo img{height:20px;filter:brightness(0)invert(1);display:block}
.sb-sec{padding:13px 14px 4px;font-size:9px;font-weight:700;
  color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.2px}
.sb-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;
  color:rgba(255,255,255,.65);cursor:pointer;border-radius:7px;margin:1px 7px;
  font-size:12.5px;font-weight:500;border:none;background:none;
  width:calc(100% - 14px);text-align:left;font-family:inherit;transition:all .15s}
.sb-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-btn.on{background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.sb-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.sb-btn.on svg{opacity:1}
.sb-n{margin-left:auto;font-size:9.5px;font-weight:700;padding:2px 6px;
  border-radius:8px;min-width:16px;text-align:center}
.n-rj{background:var(--rj);color:#fff}.n-am{background:var(--am);color:#fff}
.n-vd{background:var(--vd);color:#fff}.n-az{background:rgba(255,255,255,.18);color:#fff}
.sb-hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:5px 0}
.sb-foot{margin-top:auto;padding:10px 12px;border-top:1px solid rgba(255,255,255,.1)}
.sb-roles{display:flex;gap:5px;margin-bottom:9px}
.sb-rol{flex:1;padding:5px;border-radius:6px;border:1px solid rgba(255,255,255,.25);
  background:none;color:rgba(255,255,255,.5);font-size:9.5px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s}
.sb-rol.on{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)}
.sb-user{display:flex;align-items:center;gap:8px}
.sb-av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

/* TOPBAR */
.tb-title{font-size:14.5px;font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-search{border:1.5px solid var(--bor);border-radius:7px;padding:6px 11px;
  font-size:13px;outline:none;font-family:inherit;width:210px;background:#fff;transition:border .15s}
.tb-search:focus{border-color:var(--az2)}
.tb-btn{padding:6px 13px;border-radius:7px;border:1.5px solid var(--bor);background:#fff;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t2);
  display:inline-flex;align-items:center;gap:4px;flex-shrink:0;transition:all .15s}
.tb-btn.p{background:var(--vd);border-color:var(--vd);color:#fff}
.tb-btn:hover:not(.p){border-color:var(--az2);color:var(--az2)}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--bor);
  overflow:hidden;margin-bottom:12px}
.card:last-child{margin-bottom:0}
.ch{padding:11px 14px;border-bottom:1px solid var(--bor);display:flex;
  align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.ch h2{font-size:13.5px;font-weight:700}
.cb{padding:13px 14px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap}
.bvd{background:var(--vd2);color:#07854D}.baz{background:var(--az3);color:var(--az2)}
.bnr{background:var(--nr2);color:#CC5500}.brj{background:var(--rj2);color:var(--rj)}
.bam{background:var(--am2);color:#B7770D}.bgr{background:var(--bg);color:var(--t3);border:1px solid var(--bor)}

/* DOTS */
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dvd{background:var(--vd)}.dam{background:var(--am)}.drj{background:var(--rj)}

/* KPI */
.kpig{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:var(--r);border:1px solid var(--bor);
  padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.kpi-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0}
.kpi-v{font-size:22px;font-weight:800;line-height:1;margin-bottom:2px}
.kpi-l{font-size:10.5px;color:var(--t3);font-weight:500}
.kpi-d{font-size:10.5px;font-weight:600;margin-top:2px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:7px 12px;font-size:10px;font-weight:700;color:var(--t3);
  text-transform:uppercase;letter-spacing:.4px;background:var(--bg);
  border-bottom:2px solid var(--bor);text-align:left}
.tbl td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--bor2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover td{background:#FAFBFF}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}

/* ALERT ROWS */
.arow{padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:13px;
  border-bottom:1px solid var(--bor2);cursor:pointer;transition:background .1s}
.arow:last-child{border-bottom:none}
.arow:hover{background:var(--bg)}
.arow.rj{border-left:3px solid var(--rj);background:var(--rj2)}
.arow.am{border-left:3px solid var(--am);background:var(--am2)}

/* PROGRESS */
.pb{height:5px;background:var(--bor);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;
  border:none;display:inline-flex;align-items:center;gap:5px;font-family:inherit;
  transition:all .15s;white-space:nowrap}
.bp{background:var(--vd);color:#fff}.bo{background:#fff;color:var(--az2);border:1.5px solid var(--bor)}
.brj-btn{background:var(--rj);color:#fff}.bam-btn{background:var(--am);color:#fff}
.bf{width:100%;justify-content:center;padding:10px}.bs{padding:5px 11px;font-size:12px}
.btn:hover.bp{background:#09a85e}.btn:hover.bo{border-color:var(--az2)}

/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg.full{grid-template-columns:1fr}
.fg-item{display:flex;flex-direction:column;gap:3px}
.fg-item.full{grid-column:1/-1}
.flbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}
.finp{border:1.5px solid var(--bor);border-radius:7px;padding:8px 10px;
  font-size:13px;outline:none;font-family:inherit;width:100%;transition:border .15s;background:#fff}
.finp:focus{border-color:var(--az2)}

/* TOAST */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--az);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;
  font-weight:600;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.2);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.vd{background:var(--vd)}.toast.rj{background:var(--rj)}.toast.am{background:var(--am)}

/* FULLSCREEN CLIENT */
.fs{display:flex;flex-direction:column}
.fs-hd{display:flex;align-items:center;gap:12px;padding-bottom:14px;
  border-bottom:1px solid var(--bor);margin-bottom:14px;flex-wrap:wrap}
.fs-back{background:#fff;border:1.5px solid var(--bor);border-radius:7px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:inherit;color:var(--t2);transition:all .15s;flex-shrink:0}
.fs-back:hover{border-color:var(--az2);color:var(--az2)}
.fs-cav{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.fs-nom{font-size:17px;font-weight:800;margin-bottom:2px}
.fs-sub{font-size:11.5px;color:var(--t3)}
.fs-tabs{display:flex;gap:2px;background:var(--bg);border-radius:9px;padding:3px;
  margin-bottom:14px;flex-wrap:wrap}
.fs-tab{padding:6px 14px;border-radius:7px;border:none;background:none;font-size:13px;
  font-weight:500;color:var(--t3);cursor:pointer;font-family:inherit;
  transition:all .15s;white-space:nowrap}
.fs-tab.on{background:#fff;color:var(--az);font-weight:700;
  box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* RESUMEN GRID */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rs4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.rs-box{background:var(--bg);border:1px solid var(--bor);border-radius:8px;
  padding:9px 11px;text-align:center}
.rs-v{font-size:19px;font-weight:800;line-height:1;margin-bottom:2px}
.rs-l{font-size:9.5px;color:var(--t3);font-weight:500}
.mac4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.mac-box{background:#fff;border:2px solid;border-radius:9px;padding:10px 8px;text-align:center}
.mac-v{font-size:20px;font-weight:800;line-height:1;margin-bottom:3px}
.mac-l{font-size:10px;color:var(--t3);font-weight:500}
.sec-t{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:7px;margin-top:4px}

/* REVISIÓN FOTOS - AUTO CROP */
.rev-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.rev-col-lbl{padding:6px 10px;border-radius:7px 7px 0 0;font-size:11px;font-weight:700;
  color:#fff;text-align:center}
.rev-pose-row{margin-bottom:10px}
.rev-pose-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px}
.rev-photos-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.photo-slot{position:relative;border-radius:8px;overflow:hidden;
  background:var(--bg);border:1.5px solid var(--bor);cursor:pointer;
  user-select:none}
.photo-slot::before{content:'';display:block;padding-top:133%} /* 3:4 ratio */
.photo-slot .ph-img-wrap{position:absolute;inset:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.photo-slot img{width:100%;height:100%;object-fit:contain;
  transform-origin:center center;transition:transform .15s;
  pointer-events:none}
.photo-slot .ph-empty{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--t3);font-size:11px}
.photo-slot .ph-lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);
  color:#fff;font-size:10px;font-weight:600;padding:4px;text-align:center}
.photo-slot.has{border-color:var(--vd)}
/* Zoom controls */
.ph-zoom-bar{position:absolute;top:4px;right:4px;display:flex;flex-direction:column;
  gap:3px;opacity:0;transition:opacity .2s;z-index:10}
.photo-slot:hover .ph-zoom-bar{opacity:1}
.ph-zoom-btn{background:rgba(0,0,0,.65);border:none;border-radius:4px;color:#fff;
  font-size:13px;cursor:pointer;width:24px;height:24px;display:flex;
  align-items:center;justify-content:center;font-weight:700}
.ph-zoom-btn:hover{background:rgba(0,0,0,.9)}

/* ENTRENO GRID */
.ent-grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ent-grid{border-collapse:collapse;min-width:600px}
.ent-grid th{padding:8px 10px;background:var(--az);color:#fff;font-size:12px;
  font-weight:700;text-align:left;white-space:nowrap;border-right:1px solid rgba(255,255,255,.2)}
.ent-grid td{padding:7px 10px;border-bottom:1px solid var(--bor2);
  border-right:1px solid var(--bor2);vertical-align:top;min-width:140px}
.ent-grid tr:last-child td{border-bottom:none}
.ent-grid tr:hover td{background:#FAFBFF}
.ent-cell{cursor:pointer}
.ent-nom{font-size:12.5px;font-weight:600;margin-bottom:2px}
.ent-meta{font-size:11px;color:var(--t3)}
.ent-rir{color:var(--nr);font-weight:700}
.ent-idx{width:28px;background:var(--bg);font-size:11px;font-weight:700;
  color:var(--t3);text-align:center}

/* RUTINAS EDITOR */
.sem-strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sem-strip::-webkit-scrollbar{display:none}
.sem-btn{flex-shrink:0;padding:5px 9px;border-radius:6px;border:1.5px solid var(--bor);
  background:#fff;font-size:11.5px;font-weight:600;color:var(--t2);cursor:pointer;
  font-family:inherit;transition:all .15s;white-space:nowrap}
.sem-btn.on{background:var(--az);border-color:var(--az);color:#fff}
.sem-btn.rev{border-color:var(--az2);color:var(--az2)}
.sem-btn.on.rev{background:var(--az2)}
.day-strip{display:flex;gap:5px;flex-wrap:wrap}
.day-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;
  font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer;
  font-family:inherit;transition:all .15s}
.day-btn.on{background:var(--az);border-color:var(--az);color:#fff}
.day-btn.rest{color:var(--t3);font-style:italic}
.ej-hd{display:grid;grid-template-columns:22px 1fr 52px 68px 40px 68px 28px;
  gap:5px;padding:6px 10px;background:var(--bg);border:1px solid var(--bor);
  border-bottom:none;border-radius:7px 7px 0 0}
.ej-hd span{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}
.ej-row{display:grid;grid-template-columns:22px 1fr 52px 68px 40px 68px 28px;
  gap:5px;padding:5px 10px;border:1px solid var(--bor);border-top:none;
  background:#fff;align-items:center}
.ej-row:last-child{border-radius:0 0 7px 7px}
.ej-row:hover{background:#FAFBFF}
.ej-num{font-size:11px;font-weight:700;color:var(--t3);text-align:center}
.ei{border:1.5px solid transparent;border-radius:5px;padding:4px 6px;font-size:12.5px;
  font-weight:600;outline:none;font-family:inherit;width:100%;background:transparent;
  transition:border .12s}
.ei:hover,.ei:focus{border-color:var(--az2);background:#fff}
.ei.rir{color:var(--nr)}
.es{border:1.5px solid transparent;border-radius:5px;padding:4px 3px;font-size:12px;
  outline:none;font-family:inherit;width:100%;background:transparent;cursor:pointer;
  transition:border .12s}
.es:hover,.es:focus{border-color:var(--az2);background:#fff}
.edel{background:none;border:none;cursor:pointer;color:var(--t3);border-radius:4px;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all .15s}
.edel:hover{background:var(--rj2);color:var(--rj)}
.ac-wrap{position:relative;width:100%}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;
  border:1.5px solid var(--az2);border-top:none;border-radius:0 0 7px 7px;
  max-height:180px;overflow-y:auto;z-index:500;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.ac-item{padding:7px 11px;font-size:12.5px;cursor:pointer;
  border-bottom:1px solid var(--bor2);display:flex;justify-content:space-between}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--az3)}
.ac-item small{font-size:10.5px;color:var(--t3)}

/* CP BAR */
.cp-bar{display:flex;gap:6px;align-items:center;padding:9px 12px;background:var(--az3);
  border-radius:8px;font-size:12px;color:var(--az2);font-weight:600;flex-wrap:wrap;margin-bottom:10px}
.cp-btn{padding:5px 10px;border-radius:5px;border:1.5px solid var(--az2);background:#fff;
  font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--az2);
  transition:all .15s}
.cp-btn:hover,.cp-btn.on{background:var(--az2);color:#fff}
.cp-btn.cancel{border-color:var(--rj);color:var(--rj)}
.cp-btn.cancel:hover{background:var(--rj);color:#fff}

/* NUTRICIÓN */
.nut-tbl{width:100%;border-collapse:collapse;font-size:13px}
.nut-tbl th{padding:6px 10px;font-size:9.5px;font-weight:700;color:var(--t3);
  text-align:left;background:var(--bg);text-transform:uppercase;letter-spacing:.4px}
.nut-tbl td{padding:7px 10px;border-bottom:1px solid var(--bor2)}
.nut-tbl tr:last-child td{border-bottom:none}
.ni{border:1.5px solid var(--bor);border-radius:6px;padding:4px 7px;
  font-size:13px;font-weight:700;text-align:center;outline:none;
  font-family:inherit;width:70px;transition:border .15s;background:#fff}
.ni:hover,.ni:focus{border-color:var(--az2)}
.meal-hd{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bor)}

/* CUMPLE BANNER */
.cumple{background:linear-gradient(135deg,#9B59B6,#8E44AD);color:#fff;
  border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;
  gap:10px;margin-bottom:12px}

/* DATO ROW */
.dato{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bor2);font-size:13px}
.dato:last-child{border-bottom:none}
.dato label{color:var(--t2);font-weight:500;font-size:12.5px}
.dato-inp{border:1.5px solid var(--az2);border-radius:6px;padding:5px 8px;
  font-size:13px;font-weight:600;outline:none;font-family:inherit;
  width:130px;text-align:right}

input[type=file]{display:none}
</style>
</head>
<body>

async function apiCall(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(API_TOKEN)opts.headers['Authorization']='Bearer '+API_TOKEN;
  if(body)opts.body=JSON.stringify(body);
  console.log('[API]',method,path);
  try{
    const r=await fetch(API_URL+path,opts);
    const data=await r.json();
    if(!r.ok){
      console.error('[API] Error',r.status,path,data);
      if(r.status===401||r.status===403){
        API_TOKEN=null;localStorage.removeItem('ef_token');
        showLogin();
      }
      throw new Error(data.error||'Error '+r.status);
    }
    return data;
  }catch(e){
    console.error('[API] Fetch error',path,e.message);
    throw e;
  }
}

async function doLogin(){
  const email=document.getElementById('login-email')?.value;
  const pass=document.getElementById('login-pass')?.value;
  const errEl=document.getElementById('login-err');
  if(!email||!pass){if(errEl)errEl.textContent='Rellena todos los campos';return;}
  try{
    if(errEl)errEl.textContent='Entrando...';
    const data=await apiCall('POST','/api/auth/login',{email,password:pass});
    API_TOKEN=data.token;API_ROLE=data.role;
    localStorage.setItem('ef_token',API_TOKEN);
    localStorage.setItem('ef_role',API_ROLE);
    toast('✅ Bienvenido Álvaro','vd');
    await loadClientesFromAPI();
    nav('ci');
  }catch(e){
    if(errEl)errEl.textContent=e.message||'Error de acceso';
  }
}

async function loadClientesFromAPI(){
  console.log('[API] Cargando clientes desde BD...');
  try{
    const rows=await apiCall('GET','/api/clientes');
    console.log('[API] Respuesta BD:',rows?.length,'clientes');
    if(!rows||!rows.length)return;

    const mapped=rows.map(r=>{
      const nom=r.nombre||'';
      const partes=nom.trim().split(' ');
      const init=((partes[0]?.[0]||'')+(partes[1]?.[0]||'')).toUpperCase()||'CL';
      const toDate=d=>d?new Date(d).toISOString().split('T')[0]:'';
      
      // Semanas revision
      const semRev=Array.isArray(r.semanas_revision)?r.semanas_revision:[4,8,12];
      const semana=parseInt(r.semana_actual)||1;
      const nextRev=semRev.find(s=>s>=semana)||semRev[semRev.length-1];
      
      // Pesos from historial
      const pesoAct=parseFloat(r.peso_actual||r.peso_inicial)||80;
      const pesoIni=parseFloat(r.peso_inicial)||80;
      
      // Macros — from planes_nutricion if available, else kcal_asignadas
      const kcal=parseInt(r.kcal_total||r.kcal_asignadas)||2000;
      const prot=parseInt(r.proteina_g)||160;
      const carbs=parseInt(r.carbos_g)||200;
      const grasa=parseInt(r.grasas_g)||60;
      
      // Rutina dias and objetivo_kg from notas_entrenador JSON
      let rutinaDias={}, objetivoKg=null, semanaActual=semana;
      try{
        if(r.notas_entrenador){
          const notas=JSON.parse(r.notas_entrenador);
          rutinaDias=notas.rutina_dias||{};
          objetivoKg=notas.objetivo_kg||null;
          semanaActual=notas.semana_actual||semana;
        }
      }catch(e){}
      
      // Alimentos from distribucion
      let alimentos={};
      try{if(r.distribucion)alimentos=typeof r.distribucion==='string'?JSON.parse(r.distribucion):r.distribucion;}catch(e){}
      
      return{
        id:r.id,
        nom,init,
        tipo:r.tipo==='1a1'?'uno':'programa',
        email:r.email||'',
        fechaNac:toDate(r.fecha_nacimiento),
        pesoIni,
        pesoAct,
        obj:objetivoKg||(pesoIni*0.9),
        altura:parseInt(r.altura)||175,
        semana:semanaActual,
        semTotal:parseInt(r.semanas_bloque)||14,
        nextRev,
        diasSemana:parseInt(r.dias_entreno)||4,
        pasosObj:parseInt(r.pasos_obj)||8000,
        equipamiento:r.lugar==='gym'?'Gimnasio completo':r.lugar||'Gimnasio completo',
        lesiones:r.lesiones||'',
        intolerancias:r.intolerancias||'',
        comentario:r.notas||'',
        adh:parseFloat(r.adherencia)||0,
        checkInDone:false,
        revDone:false,
        diasSinPeso:0,
        macros:{kcal,p:prot,c:carbs,g:grasa},
        planPublicado:r.plan_publicado||r.visible_cliente||false,
        bloque:parseInt(r.numero_bloque)||1,
        bloqueHistorial:[],
        histPesos:[],
        checkIn:null,
        revision:null,
        inicioBloque:toDate(r.bloque_inicio||r.fecha_inicio),
        entrenador:'alvaro',
        nivel:parseInt(r.nivel)||1,
        rutina:r.rutina_cod||r.rutina_actual||'4D.TP',
        rutinaDias,
        alimentos,
      };
    });

    // Replace C array
    C.length=0;
    mapped.forEach(c=>C.push(c));

    // Load RUTINAS from rutinaDias for ALL semanas
    mapped.forEach(c=>{
      if(c.rutinaDias&&Object.keys(c.rutinaDias).length>0){
        if(!RUTINAS[c.id])RUTINAS[c.id]={__logs:{}};
        // Apply same rutina to all semanas 1-14
        for(let sem=1;sem<=14;sem++){
          if(!RUTINAS[c.id][sem])RUTINAS[c.id][sem]={};
          Object.entries(c.rutinaDias).forEach(([dia,ejes])=>{
            RUTINAS[c.id][sem][parseInt(dia)]=JSON.parse(JSON.stringify(ejes));
          });
        }
      }
    });

    updateBadges();
    render();
    toast(`✅ ${mapped.length} clientes cargados desde BD`,'vd');
    console.log('[API] Clientes cargados:',mapped.length);
  }catch(e){
    console.error('[API] Error cargando clientes:',e.message,e);
    toast('Error cargando clientes: '+e.message,'rj');
  }
}

// Toggle plan publicado via API
async function togglePublicarAPI(id){
  const c=byId(id);if(!c)return;
  c.planPublicado=!c.planPublicado;
  // Call API to update
  try{
    await apiCall('PATCH',`/api/clientes/${id}`,{plan_publicado:c.planPublicado});
  }catch(e){
    console.warn('[API] togglePublicar error:',e.message);
  }
  toast(c.planPublicado?'✅ Plan publicado':'Plan despublicado',c.planPublicado?'vd':'');
  render();
}

async function apiPublicarPlan(clienteId, bloqueId, publicado){
  try{
    if(publicado){
      await apiCall('POST',`/api/clientes/${clienteId}/aprobar-plan/${bloqueId}`);
    }
    toast(publicado?'Plan publicado al cliente ✅':'Plan despublicado','vd');
  }catch(e){
    toast('Error: '+e.message,'rj');
  }
}

async function apiGuardarPeso(clienteId, fecha, peso){
  try{
    await apiCall('POST','/api/entreno/peso',{fecha,peso});
  }catch(e){
    console.warn('[API] Error guardando peso:',e.message);

  if(!c.fechaNac)return false;
  const t=new Date(),mm=String(t.getMonth()+1).padStart(2,'0'),dd=String(t.getDate()).padStart(2,'0');

// ═══ MINI CHART ═══
function miniChart(c){
  const vals=(c.histPesos||[]).map(p=>p.v);
  if(vals.length<2)return'<div style="text-align:center;color:var(--t3);font-size:12px;padding:8px">Sin datos de peso</div>';
  const W=520,H=72,PL=28,PR=10,PT=8,PB=16;
  const mn=Math.min(...vals,c.obj)-.5,mx=Math.max(...vals)+.5;
  const xOf=i=>PL+(i/(vals.length-1))*(W-PL-PR);
  const yOf=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const pts=vals.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
  const oy=yOf(c.obj).toFixed(1);
  const area=`${xOf(0).toFixed(1)},${(H-PB).toFixed(1)} ${pts} ${xOf(vals.length-1).toFixed(1)},${(H-PB).toFixed(1)}`;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6DA4" stop-opacity=".18"/><stop offset="100%" stop-color="#2E6DA4" stop-opacity="0"/></linearGradient></defs>
    <line x1="${PL}" y1="${oy}" x2="${W-PR}" y2="${oy}" stroke="#0DBF6F" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/>
    <polygon points="${area}" fill="url(#cg)"/>
    <polyline points="${pts}" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xOf(vals.length-1).toFixed(1)}" cy="${yOf(vals[vals.length-1]).toFixed(1)}" r="4.5" fill="#2E6DA4" stroke="#fff" stroke-width="2"/>
    <text x="${PL}" y="${H}" font-size="9" fill="#9199AD">${vals[0]}kg</text>
    <text x="${W-PR}" y="${H}" text-anchor="end" font-size="9" fill="#2E6DA4" font-weight="700">${vals[vals.length-1]}kg</text>
    <text x="${W-PR}" y="${(parseFloat(oy)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="#0DBF6F" font-weight="600">obj ${c.obj}kg</text>
  </svg>`;
}

function rRevs(tipo){

      <span class="badge bvd">Enviada</span><span style="font-size:12px;color:var(--az2);font-weight:700;margin-left:8px">Feedback →</span>

    pend.forEach(c=>{h+=`<div class="arow am" onclick="openC('${c.id}','resumen')">

      <span style="font-size:12px;color:var(--az2)">Ver →</span>

function togglePublicar(id){
  const c=byId(id);if(!c)return;
  c.planPublicado=!c.planPublicado;

  // Sync to API
  if(API_TOKEN)apiCall('PATCH',`/api/clientes/${id}`,{plan_publicado:c.planPublicado}).catch(e=>console.warn('[API] toggle:',e));
  render();
}

// ═══ TAB: REVISIÓN CON FOTOS AUTO-CROP ═══
function tRevision(c){
  const nextRev=c.nextRev,rev=c.revision;
  const sems=Math.max(c.semana-1,1);
  const bajaTot=(c.pesoIni-c.pesoAct).toFixed(1);
  const bajaSem=((c.pesoIni-c.pesoAct)/sems).toFixed(2);
  const isFinalRev=(c.tipo==='programa'&&c.nextRev===12)||(c.tipo==='uno'&&c.nextRev===11);
  const PP=c.tipo==='programa'?(isFinalRev?PP_PROG_FINAL:PP_PROG):(isFinalRev?PP_UNO_FINAL:PP_UNO);

  const statsH=`<div class="rs4" style="margin-bottom:14px">
    <div class="rs-box"><div class="rs-v" style="color:var(--az2)">${c.pesoIni}kg</div><div class="rs-l">Peso inicial</div></div>
    <div class="rs-box"><div class="rs-v" style="color:var(--vd)">${bajaTot}kg</div><div class="rs-l">Bajada total</div></div>
    <div class="rs-box"><div class="rs-v" style="color:var(--nr)">${bajaSem}kg</div><div class="rs-l">Media/semana</div></div>
    <div class="rs-box"><div class="rs-v" style="color:var(--az)">${sems}</div><div class="rs-l">Semanas</div></div>
  </div>`;

  if(!rev&&c.semana!==nextRev)return`${statsH}<div style="text-align:center;padding:30px;color:var(--t3)"><div style="font-size:48px;margin-bottom:12px">📅</div><div style="font-size:16px;font-weight:700">Próxima revisión: S${nextRev}</div><div style="font-size:13px;margin-top:6px">Semana actual: S${c.semana}</div></div>`;

  // FOTOS: cada postura en su fila, S0 vs actual lado a lado
  // object-fit:cover + object-position: permite crop manual
  // All revision slots for this tipo
  const allRevSems=c.tipo==='programa'?[0,4,8,12]:[0,3,7,11];
  const revLabels={0:'S0 Inicio',4:'S4',8:'S8',12:'S12',3:'S3',7:'S7',11:'S11'};
  const revCols=['#0DBF6F','#2E6DA4','#9B59B6','#E74C3C'];
  const fotosH=`<div class="sec-t" style="margin-bottom:8px">Comparativa fotos — todas las revisiones <span style="font-weight:400;font-size:9.5px">(hover → ajustar crop)</span></div>
  <div style="margin-bottom:14px">

function phZoom(id,delta,dir){
  const img=document.getElementById(id);if(!img)return;
  let sc=parseFloat(img.dataset.scale)||1;
  let tx=parseFloat(img.dataset.tx)||0;
  let ty=parseFloat(img.dataset.ty)||0;
  if(dir==='reset'){sc=1;tx=0;ty=0;}
  else if(dir==='up'){ty-=20;}
  else if(dir==='down'){ty+=20;}
  else if(dir==='left'){tx-=20;}
  else if(dir==='right'){tx+=20;}
  else{sc=Math.max(0.5,Math.min(4,sc+delta));}
  img.dataset.scale=sc;img.dataset.tx=tx;img.dataset.ty=ty;
  img.style.transform=`scale(${sc}) translateX(${tx/sc}px) translateY(${ty/sc}px)`;
}

function guardarFeedback(id){
  const ta=document.getElementById('fb-'+id);
  const c=byId(id);
  if(c&&c.revision&&ta)c.revision.feedback=ta.value;
  toast('Feedback guardado ✓','vd');
}

// ═══ NUTRICIÓN ═══
// Estado: NE[cliId] = { meals: [{id,nom,items:[{cat,catNom,nom,cantidad,p100,c100,g100,k100,u}]}] }
// Orden fijo de categorías: hidratos → proteina → verd/fruta → grasa

const CAT_ORDER_NUT=['hidrat','prot','verd','fat','fruta'];
const CAT_NOM_NUT={prot:'Proteína',hidrat:'Hidratos',fat:'Grasa',verd:'Verdura',fruta:'Fruta'};
const CAT_KEY_NUT={prot:'proteinas_magras',hidrat:'hidratos',fat:'grasas',verd:'verduras',fruta:'frutas'};
const MEAL_ORDER_NUT=['desayuno','comida','cena','snack'];
const MEAL_NOM_NUT={desayuno:'☀️ Desayuno',comida:'🌞 Comida',cena:'🌙 Cena',snack:'🍎 Snack'};

function getNutState(c){
  if(NE[c.id]&&NE[c.id].meals)return NE[c.id];
  const meals=MEAL_ORDER_NUT.map(mKey=>{
    const md=MENU[mKey]||{};
    const items=[];
    CAT_ORDER_NUT.forEach(cat=>{
      const arr=md[CAT_KEY_NUT[cat]];
      if(!arr||!arr.length)return;
      const def=arr[0];
      items.push({cat,catNom:CAT_NOM_NUT[cat],
        nom:def.nom||def.alimento||'',
        cantidad:def.cantidad||100,
        p100:def.p_100||0,c100:def.c_100||0,g100:def.g_100||0,k100:def.kcal_100||0,
        u:def.u||'g'});
    });
    return{id:mKey,nom:MEAL_NOM_NUT[mKey],items};
  }).filter(m=>m.items.length);
  // If client has alimentos from BD plan, use those instead of MENU defaults
  if(c.alimentos&&Object.keys(c.alimentos).length>0){
    const bdMeals=[];
    const mealOrder=['desayuno','comida','cena','snack'];
    const mealNoms={desayuno:'☀️ Desayuno',comida:'🌞 Comida',cena:'🌙 Cena',snack:'🍎 Snack'};
    mealOrder.forEach(mKey=>{
      const items=c.alimentos[mKey];
      if(!items||!items.length)return;
      // Need p100,c100,g100,k100 for each item - get from MENU
      const enriched=items.map(it=>{
        // Find nutritional values from MENU
        let p100=0,c100=0,g100=0,k100=0;
        for(const mealKey of Object.keys(MENU)){
          for(const catKey of Object.values(CAT_KEY_NUT)){
            const found=(MENU[mealKey][catKey]||[]).find(m=>(m.nom||m.alimento||'').toLowerCase()===it.nom.toLowerCase());
            if(found){p100=found.p_100||0;c100=found.c_100||0;g100=found.g_100||0;k100=found.kcal_100||0;break;}
          }
          if(k100>0)break;
        }
        return{...it,p100,c100,g100,k100,catNom:CAT_NOM_NUT[it.cat]||it.cat};
      });
      bdMeals.push({id:mKey,nom:mealNoms[mKey]||mKey,items:enriched});
    });
    if(bdMeals.length>0){
      NE[c.id]={meals:bdMeals};
      return NE[c.id];
    }
  }
  
  NE[c.id]={meals};
  return NE[c.id];
}

function nutCalc(it){
  const r=it.cantidad/100;
  return{p:+(it.p100*r).toFixed(1),c:+(it.c100*r).toFixed(1),
         g:+(it.g100*r).toFixed(1),k:Math.round(it.k100*r)};
}

function nutSnapshot(cliId){
  return JSON.stringify(getNutState(byId(cliId)).meals);
}

  <div id="nut-meals-${c.id}">${nutMealsHTML(c)}</div>

    <button class="btn bo bs" style="margin-left:auto;color:var(--t3)" onclick="nutReset('${c.id}')">↺ Resetear</button>
  </div>`;

  const state=getNutState(c);

}

function nutItemRow(cliId,mi,ii,it){
  const r=nutCalc(it);

// ── PICKER (inline en el panel, sin prompt del navegador) ──
function nutShowPicker(cliId,mi,cat){
  // Get options sorted and deduplicated from MENU
  const opts=[];
  MEAL_ORDER_NUT.forEach(mk=>{
    (MENU[mk]?.[CAT_KEY_NUT[cat]]||[]).forEach(it=>{
      if(!opts.find(o=>o.nom===(it.nom||it.alimento)))
        opts.push({nom:it.nom||it.alimento||'',cantidad:it.cantidad||100,
          p100:it.p_100||0,c100:it.c_100||0,g100:it.g_100||0,k100:it.kcal_100||0,u:it.u||'g'});
    });
  });
  // Show inline picker below the button row
  const pickerId=`nut-picker-${cliId}-${mi}`;
  let el=document.getElementById(pickerId);
  if(el){el.remove();return;} // toggle off
  const card=document.getElementById(`nutb-${cliId}-${mi}`)?.closest('.card');
  if(!card)return;
  const div=document.createElement('div');
  div.id=pickerId;
  div.style.cssText='padding:10px 14px;border-top:1px solid var(--bor2);background:var(--az3)';
  div.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--az2);margin-bottom:8px">Añadir ${CAT_NOM_NUT[cat]} — elige:</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">
      ${opts.map((o,oi)=>`<button class="btn bo bs" style="font-size:11px" onclick="nutPickItem('${cliId}',${mi},'${cat}',${oi},'${(o.nom||'').replace(/'/g,"\\'")}',${o.cantidad},${o.p100},${o.c100},${o.g100},${o.k100},'${o.u||'g'}')">${o.nom}</button>`).join('')}
    </div>
    <button class="btn bo bs" style="margin-top:8px;color:var(--t3)" onclick="document.getElementById('${pickerId}').remove()">Cancelar</button>`;
  card.appendChild(div);
}

function nutPickItem(cliId,mi,cat,oi,nom,cantidad,p100,c100,g100,k100,u){
  const state=getNutState(byId(cliId));
  if(!state.meals[mi])return;
  UNDO_NUT.push({cliId,structural:true,snap:nutSnapshot(cliId)});
  if(UNDO_NUT.length>UNDO_MAX)UNDO_NUT.shift();
  // Insert in correct position per CAT_ORDER_NUT
  const catIdx=CAT_ORDER_NUT.indexOf(cat);
  const insertAfter=state.meals[mi].items.reduce((last,it,i)=>{
    return CAT_ORDER_NUT.indexOf(it.cat)<=catIdx?i:last;
  },-1);
  state.meals[mi].items.splice(insertAfter+1,0,
    {cat,catNom:CAT_NOM_NUT[cat],nom,cantidad,p100,c100,g100,k100,u});
  // Close picker
  const pickerId=`nut-picker-${cliId}-${mi}`;
  document.getElementById(pickerId)?.remove();
  nutRepaint(cliId);
  toast(nom+' añadido ✓','vd');
}

// ── LIVE UPDATE (DOM only) ──
function nutLive(inp){
  const cliId=inp.dataset.cli,mi=+inp.dataset.mi,ii=+inp.dataset.ii;
  const g=parseFloat(inp.value)||0;
  const state=getNutState(byId(cliId));
  const it=state.meals[mi]?.items[ii];if(!it)return;
  const r=nutCalc({...it,cantidad:g});
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set(`np-${cliId}-${mi}-${ii}`,r.p+'g');
  set(`nc-${cliId}-${mi}-${ii}`,r.c+'g');
  set(`ng-${cliId}-${mi}-${ii}`,r.g+'g');
  set(`nk-${cliId}-${mi}-${ii}`,r.k);
  nutUpdateTotals(cliId);
}

function nutUpdateTotals(cliId){
  const c=byId(cliId);if(!c)return;
  const state=getNutState(c);
  let totK=0,totP=0,totC=0,totG=0;
  // Use DOM values where available (unsaved live edits)
  state.meals.forEach((meal,mi)=>{
    let mK=0,mP=0,mC=0,mG=0;
    meal.items.forEach((it,ii)=>{
      const inp=document.querySelector(`input[data-cli="${cliId}"][data-mi="${mi}"][data-ii="${ii}"]`);
      const g=inp?parseFloat(inp.value)||0:it.cantidad;
      const r=nutCalc({...it,cantidad:g});
      totK+=r.k;totP+=r.p;totC+=r.c;totG+=r.g;
      mK+=r.k;mP+=r.p;mC+=r.c;mG+=r.g;
    });
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
    set(`ms-${cliId}-${mi}`,`${Math.round(mK)} kcal · P:${Math.round(mP)}g C:${Math.round(mC)}g G:${Math.round(mG)}g`);
  });
  const diff=Math.round(totK-c.macros.kcal);
  const diffCol=Math.abs(diff)<100?'var(--vd)':Math.abs(diff)<200?'var(--am)':'var(--rj)';
  const set=(id,v,col)=>{const el=document.getElementById(id);if(el){el.textContent=v;if(col)el.style.color=col;}};
  set(`nt-k-${cliId}`,Math.round(totK),diffCol);
  set(`nt-p-${cliId}`,Math.round(totP)+'g');
  set(`nt-c-${cliId}`,Math.round(totC)+'g');
  set(`nt-g-${cliId}`,Math.round(totG)+'g');
  set(`nt-d-${cliId}`,'('+(diff>0?'+':'')+diff+')',diffCol);
}

// ── SAVE (state + undo, onblur) ──
function nutSave(inp){
  if(!inp.value.trim())return;
  const newVal=parseFloat(inp.value)||0;
  const prev=parseFloat(inp.dataset.orig??newVal);
  if(prev===newVal)return;
  const cliId=inp.dataset.cli,mi=+inp.dataset.mi,ii=+inp.dataset.ii;
  UNDO_NUT.push({cliId,mi,ii,g:prev});
  if(UNDO_NUT.length>UNDO_MAX)UNDO_NUT.shift();
  const state=getNutState(byId(cliId));
  if(state.meals[mi]?.items[ii])state.meals[mi].items[ii].cantidad=newVal;
  inp.dataset.orig=String(newVal);
}

// ── UNDO (handles both quantity changes and structural) ──
function nutUndo(){
  if(!UNDO_NUT.length){toast('Nada más que deshacer en nutrición','');return;}
  const last=UNDO_NUT.pop();
  if(last.structural){
    // Restore full meals snapshot
    const state=getNutState(byId(last.cliId));
    state.meals=JSON.parse(last.snap);
    nutRepaint(last.cliId);
    toast(`↩ Restaurado (${UNDO_NUT.length} más)`,'vd');
    return;
  }
  // Quantity change
  const state=getNutState(byId(last.cliId));
  if(state.meals[last.mi]?.items[last.ii])
    state.meals[last.mi].items[last.ii].cantidad=last.g;
  const inp=document.querySelector(`input[data-cli="${last.cliId}"][data-mi="${last.mi}"][data-ii="${last.ii}"]`);
  if(inp){inp.value=last.g;inp.dataset.orig=String(last.g);nutLive(inp);}
  toast(`↩ Deshecho (${UNDO_NUT.length} más)`,'vd');
}

// ── STRUCTURAL CHANGES ──

function nutAddMealFromTemplate(cliId,templateId,nom,tipo){
  const state=getNutState(byId(cliId));
  UNDO_NUT.push({cliId,structural:true,snap:nutSnapshot(cliId)});
  if(UNDO_NUT.length>UNDO_MAX)UNDO_NUT.shift();
  // Build items from MENU based on tipo
  let items=[];
  if(tipo&&MENU[tipo]){
    const md=MENU[tipo];
    // Only magras for protein (no grasas proteins), in CAT_ORDER_NUT order
    const CATS_TO_LOAD = tipo==='snack'
      ? ['hidrat','prot'] // snack: no fat by default
      : ['hidrat','prot','verd','fat']; // main meals: hidrat+prot+verd+fat
    CATS_TO_LOAD.forEach(cat=>{
      const arr=md[CAT_KEY_NUT[cat]];
      if(!arr||!arr.length)return;
      const def=arr[0];
      items.push({cat,catNom:CAT_NOM_NUT[cat],
        nom:def.nom||def.alimento||'',cantidad:def.cantidad||100,
        p100:def.p_100||0,c100:def.c_100||0,g100:def.g_100||0,k100:def.kcal_100||0,
        u:def.u||'g'});
    });
  }
  state.meals.push({id:templateId+'_'+Date.now(),nom,items});
  // Close picker
  document.querySelectorAll('[id^="nut-addmeal-picker-"]').forEach(el=>el.remove());
  nutRepaint(cliId);
  toast(nom+' añadida','vd');
}

// ═══ RUTINAS EDITOR ═══
function getRut(cliId,sem,dia){
  if(!RUTINAS[cliId])RUTINAS[cliId]={};
  if(!RUTINAS[cliId].__logs)RUTINAS[cliId].__logs={};
  if(!RUTINAS[cliId][sem])RUTINAS[cliId][sem]={};
  if(RUTINAS[cliId][sem][dia]===undefined){
    // Try to get from client's rutinaDias first
    const c=byId(cliId);
    if(c&&c.rutinaDias&&c.rutinaDias[String(dia)]){
      RUTINAS[cliId][sem][dia]=JSON.parse(JSON.stringify(c.rutinaDias[String(dia)]));
    } else {
      RUTINAS[cliId][sem][dia]=JSON.parse(JSON.stringify(EJ_DEF[dia]||[]));
    }
  }
  return RUTINAS[cliId][sem][dia];
}

// Log a completed set for an exercise (called from future client app sync)
function logEj(cliId,ejNom,sem,vals){
  if(!RUTINAS[cliId])RUTINAS[cliId]={};
  if(!RUTINAS[cliId].__logs)RUTINAS[cliId].__logs={};
  if(!RUTINAS[cliId].__logs[ejNom])RUTINAS[cliId].__logs[ejNom]=[];
  const logs=RUTINAS[cliId].__logs[ejNom];
  // Replace if same sem, else add
  const idx=logs.findIndex(l=>l.sem===sem);
  if(idx>=0)logs[idx].vals=vals;
  else logs.push({sem,vals});
  // Keep last 12 sessions only
  if(logs.length>12)logs.shift();
}

// Live update without undo (while typing)
function ejUpd(ei,k,v){
  const ejes=getRut(RUT_CLI,RUT_SEM,RUT_DIA);
  if(ejes[ei])ejes[ei][k]=v;
}
// Save to undo on blur/change (when leaving field)
function ejSave(ei,k,v){
  if(_blockEjSave)return; // blocked after add/del to prevent spurious undo entries
  rutPush();
  const ejes=getRut(RUT_CLI,RUT_SEM,RUT_DIA);
  if(ejes[ei])ejes[ei][k]=v;
}

function acSearch(inp,ei){
  const q=inp.value.toLowerCase().trim();
  const list=document.getElementById('ac-'+ei);if(!list)return;
  if(!q||q.length<2){list.style.display='none';return;}
  const ms=EJ.filter(e=>e.nombre.toLowerCase().includes(q)).slice(0,8);
  if(!ms.length){list.style.display='none';return;}
  list.innerHTML=ms.map(e=>`<div class="ac-item" onmousedown="acSel(${ei},'${e.nombre.replace(/'/g,"\\'")}')"><span>${e.nombre}</span><small>${e.grupo||''}</small></div>`).join('');
  list.style.display='block';
}
function acHide(ei){const l=document.getElementById('ac-'+ei);if(l)l.style.display='none';}
function acSel(ei,nom){
  const ej=EJ.find(e=>e.nombre===nom);if(!ej)return;
  rutPush();
  const ejes=getRut(RUT_CLI,RUT_SEM,RUT_DIA);
  if(ejes[ei]){
    ejes[ei].nom=ej.nombre;ejes[ei].sets=parseInt(ej.series)||3;
    ejes[ei].reps=ej.reps||'8-10';ejes[ei].rir=parseInt(ej.rir)||2;
    ejes[ei].url=ej.url||'';
    const restMap={compound:180,maquina:120,aislamiento:90,abdomen:60,gemelos:60};
    ejes[ei].rest=restMap[ej.tipo?.toLowerCase()]||90;
  }
  acHide(ei);
  // Patch just this row
  const row=document.getElementById('ejr-'+ei);
  if(row)row.outerHTML=ejRow(ejes[ei],ei);
  toast(nom+' ✓','vd');
}

function addEj(){
  _blockEjSave=true;
  setTimeout(()=>{_blockEjSave=false;},200);
  rutPush();
  const ejes=getRut(RUT_CLI,RUT_SEM,RUT_DIA);
  ejes.push({nom:'',sets:3,reps:'8-10',rir:2,rest:120,url:''});
  rutRefresh();
  setTimeout(()=>{
    const inputs=document.querySelectorAll('.ei');
    if(inputs.length)inputs[inputs.length-1].focus();
  },50);
}
function delEj(ei){
  _blockEjSave=true;
  setTimeout(()=>{_blockEjSave=false;},200);
  rutPush();
  const ejes=getRut(RUT_CLI,RUT_SEM,RUT_DIA);
  ejes.splice(ei,1);
  rutRefresh();
}

const _cpDest=new Set();

function cpSem(sem){

  DIAS_BASE.forEach((_,di)=>{data[di]=JSON.parse(JSON.stringify(getRut(RUT_CLI,sem,di)));});
  CP_MODE='semana';CP_DATA={sem,data};_cpDest.clear();

function cpDia(sem,dia){
  CP_MODE='dia';CP_DATA={sem,dia,ejes:JSON.parse(JSON.stringify(getRut(RUT_CLI,sem,dia)))};
  if(VIEW==='client')setTab('entreno');else render();
  toast(DIAS_BASE[dia].nom+' copiado — ve a la semana destino y pulsa Pegar','vd');

function cpToggleDest(s){
  if(_cpDest.has(s))_cpDest.delete(s);else _cpDest.add(s);
  // Update button state without re-render
  const btn=document.getElementById('cpd-'+s);
  if(btn)btn.classList.toggle('on',_cpDest.has(s));
  // Update paste button label
  const pasteBtns=document.querySelectorAll('.cp-btn.on[onclick*="cpPegarSel"]');
  pasteBtns.forEach(b=>{b.textContent='📌 Pegar en '+_cpDest.size+' semana'+(_cpDest.size!==1?'s':'');b.style.opacity=_cpDest.size===0?'0.5':'1';});
}

function cpPegarSel(){
  if(!CP_DATA||!_cpDest.size){toast('Selecciona al menos una semana destino','rj');return;}
  rutPush();
  _cpDest.forEach(s=>{
    if(!RUTINAS[RUT_CLI])RUTINAS[RUT_CLI]={};
    if(!RUTINAS[RUT_CLI][s])RUTINAS[RUT_CLI][s]={};
    Object.keys(CP_DATA.data).forEach(d=>{
      RUTINAS[RUT_CLI][s][parseInt(d)]=JSON.parse(JSON.stringify(CP_DATA.data[d]));
    });
  });
  toast('S'+CP_DATA.sem+' pegada en semanas: '+[..._cpDest].sort((a,b)=>a-b).join(', ') +' ✓','vd');
  CP_MODE=null;CP_DATA=null;_cpDest.clear();
  if(VIEW==='client')setTab('entreno');else render();
}

function cpPegar(sem,dia){
  // Paste a single day
  if(!CP_DATA||CP_MODE!=='dia')return;
  rutPush();
  if(!RUTINAS[RUT_CLI])RUTINAS[RUT_CLI]={};
  if(!RUTINAS[RUT_CLI][sem])RUTINAS[RUT_CLI][sem]={};
  RUTINAS[RUT_CLI][sem][dia]=JSON.parse(JSON.stringify(CP_DATA.ejes));
  toast('Pegado en '+DIAS_BASE[dia].nom+' S'+sem+' ✓','vd');
  CP_MODE=null;CP_DATA=null;
  rutRefresh();
}

// Store globally for the import confirm
let _importRuts=null;
function cpImportConfirm(sem,idx){
  const picker=document.getElementById('rut-import-picker');
  if(!picker)return;
  const RUTS_ALL=picker._ruts||window._importPickerRuts;
  if(!RUTS_ALL||!RUTS_ALL[idx])return;
  const code=RUTS_ALL[idx].code;
  const rutData=RUTINAS_PARSED[code];
  if(!rutData){toast('Rutina no encontrada: '+code,'rj');picker.remove();return;}
  // RUT_CLI might be null if called from grid view — use CLI_ID
  const cliId=RUT_CLI||CLI_ID;
  if(!cliId){toast('No hay cliente seleccionado','rj');picker.remove();return;}
  RUT_CLI=cliId;
  rutPush();
  if(!RUTINAS[cliId])RUTINAS[cliId]={};
  if(!RUTINAS[cliId][sem])RUTINAS[cliId][sem]={};
  // Apply each day — mutate DIAS_BASE in place (no spread)
  DIAS_BASE.forEach((d,di)=>{
    const dayEjs=rutData[String(di)];
    if(dayEjs===undefined)return; // day not in rutina, leave as is
    if(!dayEjs||dayEjs.length===0){
      RUTINAS[cliId][sem][di]=[];
      DIAS_BASE[di].rest=true;
      DIAS_BASE[di].tipo='Descanso';
    } else {
      RUTINAS[cliId][sem][di]=dayEjs.map(e=>({
        nom:e.nom,sets:e.sets,reps:String(e.reps),
        rir:e.rir,rest:e.rest,url:e.url||'',acl:e.acl||''
      }));
      DIAS_BASE[di].rest=false;
    }
  });
  picker.remove();
  ENT_VIEW='grid';
  RUT_SEM=sem;
  if(VIEW==='client')setTab('entreno');else render();
  toast('✅ '+code+' importada en S'+sem,'vd');
}

function editC(id,k,v){const c=byId(id);if(c)c[k]=(k==='inicioBloque'||isNaN(+v))?v:parseFloat(v);}
function editM(id,k,v){
  const c=byId(id);if(!c||!c.macros)return;
  c.macros[k]=parseFloat(v)||0;
  // Recalcular kcal automáticamente: P×4 + C×4 + G×9
  c.macros.kcal=Math.round((c.macros.p||0)*4+(c.macros.c||0)*4+(c.macros.g||0)*9);
  // Update kcal input if visible
  const kInp=document.querySelector(`input[onchange*="editM('${id}','kcal'"]`);
  if(kInp)kInp.value=c.macros.kcal;
  // Update kcal display
  const kEl=document.querySelector(`[data-kcal-id="${id}"]`);
  if(kEl)kEl.textContent=c.macros.kcal;
}

      <div class="fg-item"><div class="flbl">Pasos/día</div><input class="finp" id="nc-pasos" type="number" placeholder="10000"></div>
      <div class="fg-item"><div class="flbl">Equipamiento</div><select class="finp" id="nc-equip"><option>Gimnasio completo</option><option>Casa con mancuernas, bandas y banco</option><option>Casa con mancuernas y bandas (sin banco)</option><option>Sin material</option></select></div>
      <div class="fg-item"><div class="flbl">Fecha inicio bloque</div><input class="finp" id="nc-inicio" type="date"></div>
      <div class="fg-item full"><div class="flbl">Lesiones / molestias</div><textarea class="finp" id="nc-lesiones" rows="2" placeholder="Ninguna"></textarea></div>
      <div class="fg-item full"><div class="flbl">Intolerancias / alergias</div><textarea class="finp" id="nc-intol" rows="2" placeholder="Ninguna"></textarea></div>
      <div class="fg-item full"><div class="flbl">Notas adicionales</div><textarea class="finp" id="nc-notas" rows="2"></textarea></div>
    </div>
    <button class="btn bp bf" style="margin-top:12px" onclick="crearCliente()">Crear cliente ✓</button>
  </div></div>`;
}

function crearCliente(){
  const g=id=>document.getElementById(id)?.value?.trim();
  const nom=g('nc-nom'),email=g('nc-email'),tipo=g('nc-tipo')||'uno';
  if(!nom||!email){toast('Nombre y email son obligatorios','rj');return;}
  const peso=parseFloat(g('nc-peso'))||80;
  const obj=parseFloat(g('nc-obj'))||Math.round(peso*0.9);
  const dias=parseInt(g('nc-dias'))||4;
  const kcal=parseInt(g('nc-kcal'))||2000;
  const pasos=parseInt(g('nc-pasos'))||(tipo==='uno'?10000:8000);
  const p=Math.round(peso*1.73),gf=60,c=p;
  const kcalReal=p*4+gf*9+c*4;
  const init=nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const id=nom.toLowerCase().replace(/\s+/g,'_').replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').replace(/[^a-z_]/g,'')+'_'+Date.now().toString().slice(-4);
  const rs=tipo==='programa'?[4,8,12,14]:[3,7,11,13];
  const inicio=g('nc-inicio')||new Date().toISOString().split('T')[0];
  const nuevo={
    id,nom,init,tipo,email,
    fechaNac:g('nc-fnac')||'',
    altura:parseInt(g('nc-altura'))||175,
    lesiones:g('nc-lesiones')||'',intolerancias:g('nc-intol')||'',
    comentario:g('nc-notas')||'',
    objetivo:'Perder grasa y definir',actividad:'moderado',
    equipamiento:g('nc-equip')||'Gimnasio completo',
    diasSemana:dias,comidas:'3 comidas',
    semana:1,semTotal:tipo==='programa'?14:13,
    pesoIni:peso,pesoAct:peso,obj,pasosObj:pasos,
    adh:0,checkInDone:false,revDone:false,nextRev:rs[0],
    diasSinPeso:0,inicioBloque:inicio,
    macros:{kcal:kcal||kcalReal,p,c,g:gf},
    bajanSem:0.7,histPesos:[{f:inicio,v:peso}],
    checkIn:null,revision:null,
    entrenador:'alvaro',bloque:1,bloqueHistorial:[],
    planPublicado:false,
  };
  C.push(nuevo);updateBadges();
  // Also create in BD
  if(API_TOKEN){
    apiCall('POST','/api/clientes',{
      nombre:nom,email:email,tipo:tipo==='uno'?'1a1':'programa',
      peso:peso,altura:parseInt(g('nc-altura'))||175,
      objetivo:'def',actividad:1.375,comidas:3,
      dias_entreno:dias,lugar:g('nc-equip')||'gym',nivel:1,
      lesiones:g('nc-lesiones')||'',
      fecha_inicio:g('nc-inicio')||new Date().toISOString().split('T')[0],
      semanas_bloque:tipo==='uno'?13:14,
    }).then(r=>toast('✅ '+nom+' creado en BD también','vd'))
      .catch(e=>console.warn('[API] crear cliente:',e.message));
  }
  toast('✅ '+nom+' añadido','vd');
  nav(tipo==='uno'?'uno':'prog');
}

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded',async()=>{
  updateBadges();
  if(API_TOKEN){
    // Show panel immediately with static data
    nav('ci');
    // Then load real data from BD
    try{
      await loadClientesFromAPI();
    }catch(e){
      console.error('[PANEL] Error cargando BD:',e);
      toast('Error conectando con BD: '+e.message,'rj');
    }
  } else {
    showLogin();
  }
});
</script>
