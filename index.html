<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnFormaFit Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --az:#1A2B5A;--az2:#2E6DA4;--az3:#EEF3FA;--az4:#D6E8F5;
  --vd:#0DBF6F;--vd2:#D4F7E8;--vd3:#7BE8B4;
  --nr:#FF6B00;--nr2:#FFF0E5;
  --rj:#E74C3C;--rj2:#FFE5E5;
  --am:#F39C12;--am2:#FEF3E2;
  --bg:#F0F2F7;--bor:#E2E6EF;--bor2:#F0F2F8;
  --t1:#1A2B5A;--t2:#5A6480;--t3:#9199AD;
  --sidebar:220px;--top:52px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;overflow:hidden}

/* LAYOUT */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--az);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--bor);height:var(--top);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:20px;gap:16px;display:flex;flex-direction:column}

/* SIDEBAR */
.sb-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo img{height:24px;width:auto;filter:brightness(0) invert(1)}
.sb-section{padding:10px 12px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 14px;color:rgba(255,255,255,.75);cursor:pointer;border-radius:8px;margin:1px 8px;font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;width:calc(100% - 16px);text-align:left;font-family:inherit}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.8}
.sb-badge{margin-left:auto;background:var(--rj);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-badge.am{background:var(--am)}
.sb-badge.vd{background:var(--vd)}
.sb-bottom{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.sb-trainer{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.85);font-size:12px}
.sb-av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}

/* TOPBAR */
.tb-title{font-size:15px;font-weight:700;color:var(--t1);flex:1}
.tb-date{font-size:12px;color:var(--t3)}
.tb-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t2);display:flex;align-items:center;gap:5px;transition:all .15s}
.tb-btn:hover{border-color:var(--az2);color:var(--az2)}
.tb-btn.primary{background:var(--vd);border-color:var(--vd);color:#fff}
.tb-search{flex:1;max-width:280px;border:1.5px solid var(--bor);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;font-family:inherit;background:#fff;transition:border .15s}
.tb-search:focus{border-color:var(--az2)}

/* CARDS */
.card{background:#fff;border-radius:12px;border:1px solid var(--bor);overflow:hidden}
.ch{padding:14px 18px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.ch h2{font-size:14px;font-weight:700}
.cb{padding:16px 18px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border-radius:12px;border:1px solid var(--bor);padding:16px;display:flex;align-items:flex-start;gap:12px}
.kpi-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.kpi-v{font-size:26px;font-weight:800;line-height:1;margin-bottom:2px}
.kpi-l{font-size:11px;color:var(--t3);font-weight:500}
.kpi-delta{font-size:11px;font-weight:600;margin-top:4px}

/* TABS */
.tabs-bar{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tab-btn{padding:6px 14px;border-radius:6px;border:none;background:none;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.tab-btn.on{background:#fff;color:var(--az);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* CLIENTE CARD */
.cliente-row{display:grid;grid-template-columns:200px 80px 90px 90px 80px 100px 90px 1fr;gap:0;align-items:center;padding:0;border-bottom:1px solid var(--bor2);cursor:pointer;transition:background .12s}
.cliente-row:hover{background:#F8F9FB}
.cliente-row:last-child{border-bottom:none}
.cr-cell{padding:11px 14px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-name{font-weight:600;display:flex;align-items:center;gap:8px}
.cr-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.cr-header{display:grid;grid-template-columns:200px 80px 90px 90px 80px 100px 90px 1fr;background:var(--bg);border-bottom:2px solid var(--bor)}
.cr-hcell{padding:8px 14px;font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bvd{background:var(--vd2);color:#07854D}.baz{background:var(--az3);color:var(--az2)}
.bnr{background:var(--nr2);color:#CC5500}.brj{background:var(--rj2);color:var(--rj)}
.bam{background:var(--am2);color:#B7770D}.bgr{background:var(--bg);color:var(--t3)}

/* SEMÁFORO */
.semaf{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.s-vd{background:var(--vd)}.s-am{background:var(--am)}.s-rj{background:var(--rj)}

/* ALERTA CLIENTES */
.alert-row{background:var(--rj2);border-left:3px solid var(--rj);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
.alert-row.am{background:var(--am2);border-left-color:var(--am)}

/* PANEL CLIENTE (modal lateral) */
.drawer{position:fixed;top:0;right:0;width:520px;height:100vh;background:#fff;border-left:1px solid var(--bor);z-index:100;transform:translateX(100%);transition:transform .25s;overflow-y:auto;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none}
.drawer-overlay.show{display:block}
.dh{padding:16px 20px;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:12px;flex-shrink:0;position:sticky;top:0;background:#fff;z-index:2}
.dh-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.drawer-tabs{display:flex;border-bottom:1px solid var(--bor);flex-shrink:0;background:#fff;position:sticky;top:73px;z-index:2}
.drawer-tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--t3);border:none;background:none;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s}
.drawer-tab.on{color:var(--az);border-bottom-color:var(--az);font-weight:700}
.drawer-body{padding:18px;flex:1}

/* DATO EDITABLE */
.dato-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bor2)}
.dato-row:last-child{border-bottom:none}
.dato-lbl{font-size:12px;color:var(--t2);font-weight:500}
.dato-val{font-size:13px;font-weight:700;color:var(--t1)}
.dato-inp{border:1.5px solid var(--az2);border-radius:6px;padding:5px 8px;font-size:13px;font-weight:600;outline:none;font-family:inherit;width:120px;text-align:right;transition:border .15s}

/* CHECK-IN VISUAL */
.ci-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ci-box{background:var(--bg);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--bor)}
.ci-v{font-size:20px;font-weight:800;margin-bottom:2px}
.ci-l{font-size:10px;color:var(--t3);font-weight:500}
.dias-row{display:flex;gap:4px;margin-bottom:10px}
.dia-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.dd-on{background:var(--vd);color:#fff}.dd-off{background:var(--bg);color:var(--t3);border:1px solid var(--bor)}
.stars-row{display:flex;gap:4px;margin-bottom:10px}
.star-f{font-size:18px}

/* REVISIÓN */
.rev-fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.rev-foto{aspect-ratio:3/5;border-radius:8px;background:var(--bg);border:1px solid var(--bor);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);text-align:center;padding:4px}
.rev-foto img{width:100%;height:100%;object-fit:cover}
.rev-med-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.rev-med{background:var(--bg);border-radius:8px;padding:9px 12px;border:1px solid var(--bor)}
.rev-med-l{font-size:10.5px;color:var(--t3);margin-bottom:2px}
.rev-med-v{font-size:16px;font-weight:800;color:var(--az)}

/* GRAPH */
svg.mini-chart{width:100%;height:60px;overflow:visible}

/* FB BOX */
.fb-box{border:1.5px solid var(--az2);border-radius:8px;padding:12px;margin-bottom:10px}
.fb-box textarea{width:100%;border:none;outline:none;font-family:inherit;font-size:13px;resize:none;min-height:80px;color:var(--t1)}

/* ALERTAS SIDEBAR */
.alert-dot{width:8px;height:8px;border-radius:50%;background:var(--rj);flex-shrink:0}

/* RESPONSIVE */
@media(max-width:1100px){
  .sidebar{width:54px}
  .sb-item span,.sb-section,.sb-trainer div,.sb-badge{display:none}
  .sb-item{justify-content:center;padding:10px;margin:2px 4px;width:calc(100% - 8px)}
  .sb-logo img{display:none}
  .sb-logo::after{content:'EF';color:#fff;font-weight:800;font-size:14px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .cliente-row,.cr-header{grid-template-columns:1fr 70px 80px 80px 70px}
  .cr-cell:nth-child(n+6),.cr-hcell:nth-child(n+6){display:none}
  .drawer{width:100%}
}

/* UTILS */
.pb{height:5px;background:var(--bor);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:all .15s}
.btnp{background:var(--vd);color:#fff}.btno{background:#fff;color:var(--az2);border:1.5px solid var(--bor)}.btnrj{background:var(--rj);color:#fff}
.btnf{width:100%;justify-content:center;padding:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--az);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.vd{background:var(--vd)}
input[type=file]{display:none}
</style>
</head>

// ── STATE ──
let SEC='checkins', CUR_CLI=null, DRAWER_TAB='checkin', EDITING=false, SEARCH='';
const DIA_NOM=['L','M','X','J','V','S','D'];
const COLORES=['#1A2B5A','#2E6DA4','#0DBF6F','#FF6B00','#9B59B6','#E74C3C','#27AE60','#E67E22','#2980B9'];

function getColor(i){return COLORES[i%COLORES.length];}
function adhColor(a){return a>=.8?'var(--vd)':a>=.6?'var(--am)':'var(--rj)';}
function adhClass(a){return a>=.8?'bvd':a>=.6?'bam':'brj';}
function semafColor(a){return a>=.8?'s-vd':a>=.6?'s-am':'s-rj';}

// ── INIT ──
window.addEventListener('DOMContentLoaded',()=>{
  const now=new Date();
  document.getElementById('tb-date').textContent=now.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  updateBadges();
  S('checkins');
});

function updateBadges(){
  const pendCI=CLIENTES.filter(c=>!c.checkInDone).length;
  const revSem=CLIENTES.filter(c=>c.semana===c.nextRev).length;
  const alertas=CLIENTES.filter(c=>c.diasSinPeso>7).length;
  document.getElementById('sb-ci-badge').textContent=pendCI;
  document.getElementById('sb-rev-badge').textContent=revSem;
  document.getElementById('sb-alert-badge').textContent=alertas;
  document.getElementById('sb-uno-badge').textContent=CLIENTES.filter(c=>c.tipo==='uno').length;
  document.getElementById('sb-prog-badge').textContent=CLIENTES.filter(c=>c.tipo==='programa').length;
}

// ── NAV ──
const TITLES={checkins:'Check-ins semana',revisiones:'Revisiones de la semana',alertas:'Alertas',uno:'Clientes 1:1',programa:'Programa grupal',logicas:'Lógicas del plan',rutinas:'Editor de rutinas',nuevo:'Nuevo cliente'};
function S(s){
  SEC=s;
  document.getElementById('tb-title').textContent=TITLES[s]||s;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('on'));
  const map={checkins:0,revisiones:1,alertas:2,uno:3,programa:4,logicas:5};
  const items=document.querySelectorAll('.sb-item');
  if(map[s]!==undefined&&items[map[s]])items[map[s]].classList.add('on');
  const ct=document.getElementById('ct');
  const fns={checkins:renderCheckins,revisiones:renderRevisiones,alertas:renderAlertas,uno:()=>renderClientes('uno'),programa:()=>renderClientes('programa'),logicas:renderLogicas,rutinas:renderEditorRutinas,nuevo:renderNuevo};
  ct.innerHTML='';
  ct.style.display='flex';
  ct.style.flexDirection='column';
  ct.style.gap='14px';
  ct.innerHTML=(fns[s]||renderCheckins)();
}

function buscarCliente(q){
  SEARCH=q.toLowerCase();
  if(SEC==='uno'||SEC==='programa')S(SEC);
}

function toast(msg,tipo=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(tipo?' '+tipo:'');setTimeout(()=>el.classList.remove('show'),2800);}

// ── CHECK-INS ──
function renderCheckins(){
  const now=new Date();
  const dow=now.getDay();
  const diasDesde=dow===1?0:dow===0?6:dow-1;
  const lunes=new Date(now);lunes.setDate(now.getDate()-diasDesde);
  const lunesStr=lunes.toLocaleDateString('es',{day:'numeric',month:'long'});

  // Check-ins SOLO para clientes 1:1 (programa no tiene check-in semanal)
  const unoClientes=CLIENTES.filter(c=>c.tipo==='uno');
  const enviados=unoClientes.filter(c=>c.checkInDone);
  const pendientes=unoClientes.filter(c=>!c.checkInDone);

  let html=`
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-ico" style="background:var(--vd2)">✅</div>
      <div><div class="kpi-v" style="color:var(--vd)">${enviados.length}</div><div class="kpi-l">Check-ins enviados</div><div class="kpi-delta" style="color:var(--vd)">de ${unoClientes.length} clientes 1:1</div></div>
    </div>
    <div class="kpi">
      <div class="kpi-ico" style="background:var(--am2)">⏳</div>
      <div><div class="kpi-v" style="color:var(--am)">${pendientes.length}</div><div class="kpi-l">Pendientes</div><div class="kpi-delta" style="color:var(--am)">sin enviar aún</div></div>
    </div>
    <div class="kpi">
      <div class="kpi-ico" style="background:var(--az3)">⭐</div>
      <div><div class="kpi-v" style="color:var(--az2)">${enviados.length?((enviados.reduce((s,c)=>s+(c.checkIn?.estrellas||0),0)/enviados.length).toFixed(1)):'—'}</div><div class="kpi-l">Media bienestar</div><div class="kpi-delta" style="color:var(--t3)">sobre 5</div></div>
    </div>
    <div class="kpi">
      <div class="kpi-ico" style="background:var(--vd2)">📊</div>
      <div><div class="kpi-v" style="color:var(--az)">${Math.round(CLIENTES.reduce((s,c)=>s+c.adh,0)/CLIENTES.length*100)}%</div><div class="kpi-l">Adherencia media</div><div class="kpi-delta" style="color:var(--t3)">todos los clientes</div></div>
    </div>
  </div>`;

  if(pendientes.length){
    html+=`<div class="card">
      <div class="ch"><h2>⏳ Pendientes de enviar (${pendientes.length})</h2></div>
      ${pendientes.map(c=>`
        <div class="alert-row am" style="cursor:pointer" onclick="openDrawer('${c.id}','checkin')">
          <div class="semaf ${semafColor(c.adh)}"></div>
          <div style="flex:1">
            <span style="font-weight:700">${c.nom}</span>
            <span style="color:var(--t3);margin-left:8px;font-size:12px">${c.tipo==='uno'?'1:1':'Programa'} · S${c.semana}/${c.semTotal}</span>
          </div>
          <span style="font-size:12px;color:var(--t3)">Adh. ${Math.round(c.adh*100)}%</span>
          <span style="font-size:12px;color:var(--az2);font-weight:600">Ver →</span>
        </div>`).join('')}
    </div>`;
  }

  html+=`<div class="card">
    <div class="ch"><h2>✅ Check-ins recibidos (${enviados.length})</h2><span style="font-size:12px;color:var(--t3)">Semana del ${lunesStr}</span></div>
    ${renderTablaHeader()}
    ${enviados.map((c,i)=>renderClienteRow(c,i,true)).join('')}
  </div>`;

  return html;
}

// ── REVISIONES ──
function renderRevisiones(){
  // Revisiones separadas por tipo
  const conRevUno=CLIENTES.filter(c=>c.tipo==='uno'&&c.semana===c.nextRev);
  const conRevProg=CLIENTES.filter(c=>c.tipo==='programa'&&c.semana===c.nextRev);
  const conRev=[...conRevUno,...conRevProg];
  const proxSem=CLIENTES.filter(c=>c.nextRev-c.semana===1);

  let html=`<div class="kpi-grid">

    if(enviadasP.length)revH+='<div style="padding:8px 18px 0;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">👥 Programa grupal</div>';

    revH+='</div>';
    html+=revH;
    if(false){html+=`
`;}
  }

  if(conRev.filter(c=>!c.revDone).length){

      ${conRev.filter(c=>!c.revDone).map(c=>`
        <div class="alert-row am" style="cursor:pointer" onclick="openDrawer('${c.id}','resumen')">
          <div class="semaf ${semafColor(c.adh)}"></div>
          <div style="flex:1"><span style="font-weight:700">${c.nom}</span><span style="color:var(--t3);margin-left:8px;font-size:12px">S${c.nextRev} esta semana</span></div>
          <span style="font-size:12px;color:var(--az2)">Ver cliente →</span>
        </div>`).join('')}
    </div>`;

  if(proxSem.length){
    html+=`<div class="card">
      <div class="ch"><h2>📅 La semana que viene</h2></div>
      <div style="padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px">

}

// ── DRAWER ──
function openDrawer(id, tab='resumen'){
  CUR_CLI=CLIENTES.find(c=>c.id===id);
  if(!CUR_CLI)return;
  DRAWER_TAB=tab;EDITING=false;
  const ci=CLIENTES.indexOf(CUR_CLI);
  document.getElementById('dh-av').textContent=CUR_CLI.init;
  document.getElementById('dh-av').style.background=getColor(ci);
  document.getElementById('dh-nom').textContent=CUR_CLI.nom;
  document.getElementById('dh-sub').textContent=`${CUR_CLI.tipo==='uno'?'1:1':'Programa'} · Semana ${CUR_CLI.semana}/${CUR_CLI.semTotal}`;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('doverlay').classList.add('show');
  renderDrawer();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('doverlay').classList.remove('show');
  CUR_CLI=null;
}
function setDrawerTab(t){DRAWER_TAB=t;EDITING=false;renderDrawer();}
function renderDrawer(){
  if(!CUR_CLI)return;
  const tabs=['resumen','checkin','revision','plan','editar'];
  const tabNoms={resumen:'Resumen',checkin:'Check-in',revision:'Revisión',plan:'Plan',editar:'Editar'};
  document.getElementById('drawer-tabs').innerHTML=tabs.map(t=>`<button class="drawer-tab ${t===DRAWER_TAB?'on':''}" onclick="setDrawerTab('${t}')">${tabNoms[t]}</button>`).join('');
  const fns={resumen:renderDResumen,checkin:renderDCheckin,revision:renderDRevision,plan:renderDPlan,editar:renderDEditar};
  document.getElementById('drawer-body').innerHTML=(fns[DRAWER_TAB]||renderDResumen)();
}

// ── DRAWER: RESUMEN ──
function renderDResumen(){
  const c=CUR_CLI;
  const adh=Math.round(c.adh*100);
  const cambio=(c.pesoAct-c.pesoIni).toFixed(1);
  const left=(c.pesoAct-c.obj).toFixed(1);

  // Mini gráfico peso
  let chartH='<div style="font-size:12px;color:var(--t3);text-align:center;padding:12px">Sin datos de peso</div>';
  if(c.histPesos&&c.histPesos.length>1){
    const W=440,H=70,PL=30,PR=8,PT=8,PB=20;
    const vals=c.histPesos.map(p=>p.v);
    const mn=Math.min(...vals,c.obj)-1;
    const mx=Math.max(...vals)+1;
    const xOf=i=>PL+(i/(vals.length-1))*(W-PL-PR);
    const yOf=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
    const pts=vals.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    const oy=yOf(c.obj).toFixed(1);
    const area=`${xOf(0).toFixed(1)},${(H-PB).toFixed(1)} `+vals.map((v,i)=>`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ')+` ${xOf(vals.length-1).toFixed(1)},${(H-PB).toFixed(1)}`;
    chartH=`<svg class="mini-chart" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="cg${c.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2E6DA4" stop-opacity=".15"/><stop offset="100%" stop-color="#2E6DA4" stop-opacity="0"/></linearGradient></defs>
      <line x1="${PL}" y1="${oy}" x2="${W-PR}" y2="${oy}" stroke="#0DBF6F" stroke-width="1.5" stroke-dasharray="5,3"/>
      <polygon points="${area}" fill="url(#cg${c.id})"/>
      <polyline points="${pts}" fill="none" stroke="#2E6DA4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xOf(vals.length-1).toFixed(1)}" cy="${yOf(vals[vals.length-1]).toFixed(1)}" r="4" fill="#2E6DA4" stroke="#fff" stroke-width="2"/>
      <text x="${PL-2}" y="${yOf(mn+1).toFixed(1)}" text-anchor="end" font-size="9" fill="#9199AD">${(mn+1).toFixed(0)}</text>
      <text x="${PL-2}" y="${yOf(mx-1).toFixed(1)}" text-anchor="end" font-size="9" fill="#9199AD">${(mx-1).toFixed(0)}</text>
      <text x="${W-PR}" y="${parseFloat(oy)-4}" text-anchor="end" font-size="9" fill="#0DBF6F" font-weight="600">obj ${c.obj}</text>
    </svg>`;
  }

  return`
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
    <div class="ci-box"><div class="ci-v" style="color:${adhColor(c.adh)}">${adh}%</div><div class="ci-l">Adherencia</div></div>
    <div class="ci-box"><div class="ci-v" style="color:var(--az2)">${c.pesoAct}kg</div><div class="ci-l">Peso actual</div></div>
    <div class="ci-box"><div class="ci-v" style="color:${parseFloat(cambio)<0?'var(--vd)':'var(--rj)'}">${cambio>0?'+':''}${cambio}kg</div><div class="ci-l">Cambio</div></div>
  </div>
  <div style="margin-bottom:14px">${chartH}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <div class="ci-box"><div class="ci-v" style="color:var(--az);font-size:16px">${c.obj}kg</div><div class="ci-l">Objetivo</div></div>
    <div class="ci-box"><div class="ci-v" style="color:${parseFloat(left)>0?'var(--nr)':'var(--vd)'};font-size:16px">${parseFloat(left)>0?left+'kg':'✅ Logrado'}</div><div class="ci-l">Para objetivo</div></div>
  </div>
  ${c.lesiones&&c.lesiones!=='Sin lesiones'&&c.lesiones?`<div style="background:var(--am2);border:1px solid var(--am);border-radius:8px;padding:10px 13px;margin-bottom:14px;font-size:13px"><b>🩹 Lesión:</b> ${c.lesiones}</div>`:''}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <button class="btn btno" style="width:100%" onclick="setDrawerTab('checkin')">📋 Check-in</button>
    <button class="btn btno" style="width:100%" onclick="setDrawerTab('revision')">📸 Revisión</button>
    <button class="btn btno" style="width:100%" onclick="setDrawerTab('plan')">💪 Plan</button>
    <button class="btn btno" style="width:100%" onclick="setDrawerTab('editar')">✏️ Editar</button>
  </div>`;
}

// ── DRAWER: REVISIÓN ──
function renderDRevision(){
  const c=CUR_CLI;
  if(!c.revDone||!c.revision){
    return`<div style="text-align:center;padding:30px;color:var(--t3)">
      <div style="font-size:40px;margin-bottom:12px">📋</div>
      <div style="font-weight:700;margin-bottom:6px">Revisión S${c.nextRev}</div>
      <div style="font-size:13px">${c.semana===c.nextRev?'Esta semana toca revisión. El cliente aún no la ha enviado.':'La revisión es en la semana '+c.nextRev+'.'}</div>
    </div>`;
  }
  const r=c.revision;
  const POSES=['Frente','Perfil der.','Perfil izq.','Espalda'];
  const MEDS=[['peso','Peso','kg'],['pecho','Pecho','cm'],['cintura','Cintura','cm'],['cadera','Cadera','cm'],['bicepsd','Bíceps D','cm'],['bicepsi','Bíceps I','cm'],['muslod','Muslo D','cm'],['musloi','Muslo I','cm'],['gemelod','Gemelo D','cm'],['gemeloi','Gemelo I','cm']];

  const medHay=MEDS.filter(([k])=>r.medidas&&r.medidas[k]);
  const respHay=Object.values(r.preguntas||{}).filter(Boolean);

  return`
  <div style="font-size:12px;color:var(--t3);margin-bottom:12px">📅 ${r.fecha} · S${c.nextRev}/${c.semTotal}</div>
  <div style="font-size:12px;font-weight:700;color:var(--t3);margin-bottom:8px;text-transform:uppercase">📸 Fotos</div>
  <div class="rev-fotos">${POSES.map((pos,pi)=>{
    const f=r.fotos&&r.fotos['rev_'+pi];
    return`<div class="rev-foto">${f?`<img src="${f}">`:`<div>${pos}</div>`}</div>`;
  }).join('')}</div>
  ${medHay.length?`
  <div style="font-size:12px;font-weight:700;color:var(--t3);margin-bottom:8px;text-transform:uppercase">📏 Medidas</div>
  <div class="rev-med-grid">${medHay.map(([k,l,u])=>`<div class="rev-med"><div class="rev-med-l">${l}</div><div class="rev-med-v">${r.medidas[k]}${u}</div></div>`).join('')}</div>`:''}
  ${respHay.length?`
  <div style="font-size:12px;font-weight:700;color:var(--t3);margin-bottom:8px;text-transform:uppercase">💬 Respuestas</div>
  ${respHay.map(resp=>`<div style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--t2);line-height:1.6;border-left:3px solid var(--az2)">"${resp}"</div>`).join('')}`:''}

function updateCli(key,val){
  if(!CUR_CLI)return;
  if(key.includes('.')){const [a,b]=key.split('.');CUR_CLI[a][b]=isNaN(val)?val:parseFloat(val);}
  else CUR_CLI[key]=isNaN(val)?val:parseFloat(val);
}
function guardarCli(){EDITING=false;renderDrawer();toast('Cambios guardados en '+CUR_CLI?.nom,'vd');}
